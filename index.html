 ognuno risponde a una domanda, ma gli impostori ne ricevono una diversa. Si discute e si cerca chi ha risposto a un'altra domanda.</p>","<p><b>⬜ Mister White</b>: i civili hanno la stessa parola, gli Undercover una simile, Mister White nessuna. A turno si danno indizi, poi si elimina un sospetto. Mister White eliminato può provare a indovinare la parola.</p>","<p><b>💬 Chi l'ha detto?</b>: tutti rispondono in segreto a una domanda; le risposte vengono lette in anonimo e si prova a indovinare chi ha scritto cosa.</p>","<p><b>🤔 Preferiresti…</b>: due opzioni scritte dal GM, ognuno vota in segreto. Vince la maggioranza, pareggio = punti a tutti.</p>","<p><b>🐺 Lupus</b>: partita completa (l'app gestisce notti, voti e vittorie) o veloce (l'app distribuisce solo i ruoli e si gioca a voce).</p>","<p><b>📝 Nomi, Cose e Città</b> (solo online): il telefono dà una lettera e delle categorie, ognuno scrive le sue risposte dal proprio telefono. Il timer parte da 5 minuti e cala a ogni consegna. Risposta unica +10, doppione +5, vuota o con la lettera sbagliata 0.</p>"].join(""),["<p><b>🕵️ Impostor</b>: everyone answers a question, but impostors get a different one. Discuss and find who answered another question.</p>","<p><b>⬜ Mister White</b>: civilians share a word, Undercovers get a similar one, Mister White gets none. Give clues in turn, then eliminate a suspect. An eliminated Mister White may try to guess the word.</p>","<p><b>💬 Who Said That?</b>: everyone secretly answers a question; the answers are read anonymously and you try to guess who wrote what.</p>","<p><b>🤔 Would You Rather…</b>: two options typed by the GM, everyone votes secretly. The majority wins; a tie gives points to everyone.</p>","<p><b>🐺 Werewolf</b>: full game (the app runs nights, votes and wins) or quick game (the app only deals roles, you play out loud).</p>","<p><b>📝 Names, Things and Cities</b> (online only): the phone gives a letter and some categories, everyone types their answers on their own phone
