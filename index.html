const NET={peer:null,conn:null,conns:{},host:false,code:'',name:'',hostName:'',players:[],st:'idle',err:'',view:null,game:null,scores:{}};
const APP_VERSION = "1.0.0";
function netLoad(cb){if(window.Peer)return cb();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=cb;s.onerror=()=>netFail({type:'lib'});document.head.appendChild(s)}
function netReset(){try{NET.conn&&NET.conn.close()}catch(e){}try{NET.peer&&NET.peer.destroy()}catch(e){}Object.assign(NET,{peer:null,conn:null,conns:{},host:false,code:'',hostName:'',players:[],st:'idle',view:null,game:null,scores:{}});render()}
function netFail(e){const m={'peer-unavailable':X('Stanza non trovata: controlla il codice.','Room not found: check the code.'),timeout:X('Nessuna risposta dall\'host.','No answer from the host.'),lib:X('Impossibile caricare la libreria online: controlla la connessione.','Could not load the online library: check your connection.')}[e.type];const er=m||X('Errore di connessione: ','Connection error: ')+(e.type||e);netReset();NET.err=er;render()}
function netOk(){const n=($('on-name').value||'').trim().slice(0,16);if(!n){NET.err=X('Scrivi il tuo nome.','Enter your name.');render();return''}NET.name=n;NET.err='';NET.st='connecting';render();return n}
function netHost(){if(!netOk())return;netLoad(()=>tryCode(0))}
function tryCode(k){const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>al[b%32]).join(''),p=new Peer('mgh-'+code);NET.peer=p;
  p.on('open',()=>{NET.host=true;NET.code=code;NET.hostName=NET.name;NET.players=[NET.name];NET.st='lobby';render()});
  p.on('error',e=>{if(e.type==='unavailable-id'&&k<5){try{p.destroy()}catch(x){}tryCode(k+1)}else netFail(e)});
  p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLeft(c));c.on('error',()=>hostLeft(c))})}
function hostBc(){Object.values(NET.conns).forEach(c=>{try{c.send({t:'lobby',players:NET.players,host:NET.hostName})}catch(e){}});render()}
function hostMsg(c,m){if(m&&m.t!=='join'){hostApply(c._n,m);return}if(!m)return;const n=String(m.name||'').trim().slice(0,16);
  if(NET.game||!n||NET.players.includes(n)||NET.players.length>=16){c.send({t:'rej',why:NET.game?'started':!n||NET.players.includes(n)?'name':'full'});setTimeout(()=>c.close(),100);return}
  c._n=n;NET.conns[n]=c;NET.players.push(n);hostBc();if (m.v !== APP_VERSION) {
  c.send({t:'rej', why:'version'});
  setTimeout(()=>c.close(), 100);
  return;
}}
function hostLeft(c){const n=c._n;if(n&&NET.conns[n]===c){delete NET.conns[n];NET.players=NET.players.filter(x=>x!==n);hostBc();if(NET.game)checkG()}}
function netJoin(){const code=($('on-code').value||'').trim().toUpperCase();if(!netOk())return;if(code.length<4){NET.st='idle';NET.err=X('Inserisci il codice stanza.','Enter the room code.');return render()}
  netLoad(()=>{const p=new Peer();NET.peer=p;p.on('error',netFail);p.on('open',()=>{const c=p.connect('mgh-'+code,{reliable:true});NET.conn=c;const to=setTimeout(()=>netFail({type:'timeout'}),12000);
    c.on('open',()=>{clearTimeout(to);c.send({t:'join',name:NET.name, v:APP_VERSION})});
    c.on('data',m=>{if(m.t==='lobby'){NET.code=code;NET.players=m.players;NET.hostName=m.host;NET.st='lobby';render()}else if(m.t==='rej'){netReset();NET.err=m.why==='full'?X('Stanza piena.','Room is full.')
          :m.why==='started'?X('La partita è già iniziata.','The game has already started.')
          :m.why==='version'?X('Versione non aggiornata. Ricarica la pagina!','Outdated version. Reload the page!')
          :X('Nome già usato o non valido.','Name already used or invalid.');render()}else netView(m)});
    c.on('close',()=>{if(NET.st==='lobby'){netReset();NET.err=X('Connessione con l\'host persa.','Lost connection to the host.');render()}})})})}
function netView(m){if(m.t==='ivote'&&!(NET.view&&NET.view.t==='ivote'))NET.sel=[];NET.view=m.t==='toLobby'?null:m;render()}
function netSend(m){Object.values(NET.conns).forEach(c=>{try{c.send(m)}catch(e){}});netView(m)}
function netAct(m){NET.host?hostApply(NET.name,m):NET.conn.send(m)}
function hostApply(n,m){const G=NET.game;if(!G||!m||!n)return;if(G.g==='lupus')return m.t==='lc'?lupCall(n,String(m.c||'')):0;if(G.g==='imp')return iApply(n,m);if(G.g==='mw')return mwApply(n,m);
  if(m.t==='ans'&&G.ph==='a'){const v=String(m.text||'').trim().slice(0,60);if(v&&NET.players.includes(n)){G.ans[n]=v;checkW()}}
  else if(m.t==='vote'&&G.ph==='v'&&n!==G.pick&&NET.players.includes(m.who)&&m.who!==n){G.votes[n]=m.who;checkW()}}
function checkG(){const G=NET.game;if(!G)return;if(G.g==='setup'){NET.game=null;NET.lsetup=false;S.screen='online';return render()}if(G.g==='lupus'){NET.game=null;S.G=null;S.screen='online';return netSend({t:'toLobby'})}if(NET.players.length<3){NET.game=null;return netSend({t:'toLobby'})}G.g==='imp'?iChk():G.g==='mw'?mwChk():checkW()}
function netTo(n,m){n===NET.name?netView(m):NET.conns[n]&&NET.conns[n].send(m)}
function netGo(){netAct({t:'go'})}
function netAgain(){const g=NET.game&&NET.game.g;g==='imp'?iNew():g==='mw'?mwNew():wNew()}
function wNew(){NET.game={g:'who',q:pickWhoQ(),ans:{},votes:{},pick:null,ph:'a'};checkW()}
function wStart(){if(NET.players.length>=3)wNew()}
function wBack(){NET.game=null;netSend({t:'toLobby'})}
function checkW(){const G=NET.game,P=NET.players;if(!G)return;
  if(P.length<3){NET.game=null;return netSend({t:'toLobby'})}
  const rp=()=>P[Math.floor(Math.random()*P.length)];
  if(G.ph==='a'&&P.every(p=>G.ans[p]!==undefined)){G.pick=rp();G.ph='v'}
  if(G.ph==='v'&&!P.includes(G.pick)){G.pick=rp();G.votes={}}
  if(G.ph==='v'&&P.filter(p=>p!==G.pick).every(p=>G.votes[p]!==undefined)){const aw={};P.forEach(p=>{aw[p]=(p!==G.pick&&G.votes[p]===G.pick)?100:0;NET.scores[p]=(NET.scores[p]||0)+aw[p]});G.aw=aw;G.ph='r'}
  netSend(G.ph==='a'?{t:'wq',q:G.q,done:Object.keys(G.ans).filter(p=>P.includes(p)),n:P.length}:G.ph==='v'?{t:'wvote',q:G.q,text:G.ans[G.pick],author:G.pick,voted:Object.keys(G.votes).filter(p=>P.includes(p)),players:[...P]}:{t:'wres',q:G.q,text:G.ans[G.pick],author:G.pick,votes:G.votes,aw:G.aw,scores:{...NET.scores},players:[...P]})}
function netAns(){const e=$('on-ans'),v=e&&e.value.trim();if(v)netAct({t:NET.view&&NET.view.t==='mwg'?'mg':'ans',text:v})}
function netTog(i){const p=NET.view.players[i],s=NET.sel||(NET.sel=[]),j=s.indexOf(p);if(j>=0)s.splice(j,1);else if(s.length<NET.view.k)s.push(p);render()}
function netSus(){if((NET.sel||[]).length===NET.view.k)netAct({t:'sus',sus:[...NET.sel]})}

  const tips=X('<p>• I <b>lupi</b> vincono quando sono almeno pari agli altri; i <b>civili</b> quando non restano lupi.</p><p>• Joker e Pittore giocano da soli; se il Sopravvissuto è ancora vivo quando una fazione vince, vince lui da solo al posto suo. L\'Azzardo vivo blocca la vittoria dei lupi. Al rogo si può votare «Salta»; in caso di pareggio c\'è un ballottaggio tra i pari merito, e se pareggia ancora il rogo è saltato.</p><p>• Di notte il telefono passa a tutti, anche a chi non ha poteri, così nessuno capisce chi agisce.</p><p>• Giocatore d\'Azzardo e Lupo Pazzo possono indovinare ruoli anche di giorno, in segreto, nel loro turno di voto. Le morti da tentativo si applicano tutte insieme a fine fase (fine notte, oppure fine votazione prima del rogo), così l\'ordine di turno non conta.</p><p>• Il Sindaco usa il potere dopo i voti: tocca "Potere del Sindaco", scegli il tuo nome e passa il telefono.</p><p>• Ruoli ★ obbligatori: escono sempre, ma non più dei posti disponibili. Ruoli attivi: possono uscire.</p><p>• Con ➕ Crea un ruolo (partita veloce) inventi ruoli su misura.</p><p>• ⚡ Modalità veloce (Impostore, Mister White, Chi l\'ha detto?): l\'app dà solo ruoli, parole o la domanda; il resto si gioca a voce.</p><p>• ⚖️ Indovinare Villico o Lupo semplici non ha effetto ma spreca il tentativo. Se un Mannaro non trasformato viene indovinato dall\'Azzardo diventa Villico semplice e il Pazzo non può più colpirlo; se dal Pazzo si unisce ai lupi (se entrambi nella stessa fase, il Mannaro muore e i due restano vivi). Il Sindaco morto nella votazione può comunque usare il potere prima del rogo. Con open sheets si vedono solo i ruoli con skill, anche se i giocatori sono morti. Open/closed sheets: con open sheets si vede l\'elenco dei ruoli presenti. Pittore e Sopravvissuto richiedono almeno 7 giocatori; neutri al massimo 1 (sotto 7), 2 (7–11), 3 (12+).</p>','<p>• <b>Wolves</b> win when they equal the others; <b>villagers</b> win when no wolves are left.</p><p>• Joker and Painter play alone; if the Survivor is still alive when a faction wins, the Survivor wins alone instead. A living Gambler blocks the wolves\' win. At the stake you can vote “Skip”; on a tie there is a runoff between the tied players, and if it ties again the stake is skipped.</p><p>• At night the phone goes to everyone, even those without powers, so nobody knows who acts.</p><p>• Gambler and Mad Wolf can also guess roles by day, secretly, on their voting turn. Deaths from guesses are all applied together at the end of the phase (end of night, or end of the vote before the stake), so turn order doesn\'t matter.</p><p>• The Mayor uses the power after the votes: tap "Mayor\'s power", pick your name and pass the phone.</p><p>• ★ mandatory roles always appear, but never more than the available seats. Active roles may appear.</p><p>• With ➕ Create a role (quick game) you can invent custom roles.</p><p>• ⚡ Quick mode (Impostor, Mister White, Who Said That?): the app only deals roles, words or the question; the rest is played out loud.</p><p>• ⚖️ Guessing a plain Villager or Wolf has no effect but wastes the attempt. An untransformed Cursed guessed by the Gambler becomes a plain Villager the Mad Wolf can no longer hit; by the Mad Wolf, joins the wolves (if both in the same phase, the Cursed dies and both stay alive). A Mayor who died in the vote can still use the power before the stake. With open sheets only roles with skills are shown, even if their players have died. Open/closed sheets: open sheets show the list of roles in the game. Painter and Survivor need at least 7 players; neutrals max 1 (under 7), 2 (7–11), 3 (12+).</p>');

  m.style.display='flex';

// --- casualità sicura: Fisher-Yates + crypto ---
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

// --- Smart Swap: se lo slot è pieno, l'occupante prende il posto precedente del giocatore spostato ---
function smartSwap(asg,p,role,limits){
  const n={...asg},prev=n[p]||'pool';
  if(prev===role)return n;
  const occ=Object.keys(n).filter(x=>n[x]===role);
  if(limits[role]!=null&&occ.length>=limits[role])n[occ[0]]=prev;
  n[p]=role;return n;
}

function mwElim(i){

  G.alive=G.alive.filter(x=>x!==p);G.out.push(p);G.last=p;

}
const ARTS=['il','lo','la','l','i','gli','le','un','uno','una','the','a','an','di','del','della'];
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function nrm2(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x&&!ARTS.includes(x)).join(' ')}
function near(a,b){if(a===b)return true;const L=Math.max(a.length,b.length),d=lev(a,b);if(L>=8)return d<=2;if(L>=5)return d<=1;return L===4&&d===1&&a.slice(0,3)===b.slice(0,3)}
function matchLevel(g,w){
  const a=nrm2(g),b=nrm2(w);if(!a||!b)return'no';
  if(near(a.replace(/ /g,''),b.replace(/ /g,'')))return'yes';
  let ta=a.split(' '),tb=b.split(' ');if(ta.length>tb.length)[ta,tb]=[tb,ta];
  if(ta.join('').length>=4&&ta.every(x=>tb.some(y=>near(x,y))))return'yes';
  return'no';
}
function mwGuess(){
  const G=S.G,raw=$('g-in').value.trim();
  if(!raw){$('g-in').focus();return}
  if([G.pair[G.swap?1:0],G.pair[2+(G.swap?1:0)]].some(w=>matchLevel(raw,w)==='yes')){G.guessed=true;G.winner='imp';mwEnd();return}
  G.guessTxt=raw;G.phase='review';render();
}

function mwSkip(){const G=S.G;G.guessed=false;mwCheck();if(G.phase!=='end')render()}

}

const L=()=>S.lc||(S.lc={wolves:null,on:new Set([...CORE,...SPEC_C,...SPEC_W,...SPEC_T]),assign:'rand',must:new Set(),manual:{}});
function lMax(n){return Math.max(1,Math.floor(n/3))}
function lW(n){return Math.min(lMax(n),L().wolves??(n<8?1:2+Math.floor((n-8)/5)))}

function VV(){const G=S.G;return G.votes.filter(o=>G.alive.includes(o.t)||o.t==='__skip')}
function vn(t){return t==='__skip'?X('⏭️ Salta','⏭️ Skip'):esc(t)}
function vSkip(){const G=S.G;G.votes.push({v:G.vq[G.vi],t:'__skip'});vAdv()}
function vStart(){const G=S.G;G.votes=[];G.news=[];G.dg=null;G.gd={};G.pend=[];G.runoff=false;G.cand=null;G.vq=S.players.filter(p=>G.alive.includes(p));G.vi=0;G.shown=false;G.mayorName='';G.phase='vote';render()}
function vAdv(){const G=S.G;if(G.note)delete G.note[G.vq[G.vi]];G.vi++;G.shown=false;G.dg=null;while(G.vi<G.vq.length&&!G.alive.includes(G.vq[G.vi]))G.vi++;if(G.vi>=G.vq.length){applyMann();applyCure();applyDeaths();G.phase='vsum'}render()}
function vCast(i){const G=S.G;G.votes.push({v:G.vq[G.vi],t:S.players[i]});vAdv()}
function dgOpen(){S.G.dg={st:'tgt'};render()}
function dgTgt(i){const d=S.G.dg;d.t=S.players[i];d.st='role';render()}
function dgRole(r){const G=S.G,a=G.vq[G.vi],d=G.dg,k=gGuess(a,d.t,r);if(k==='wrong'||glim()==='one')G.gd[a]=1;d.st='msg';d.msg=gMsg(k,d.t);render()}
function dgBack(){const G=S.G;G.dg=null;render()}
function vDone(){
  const G=S.G,c={},pre=[...G.news];VV().filter(o=>!G.runoff||G.cand.includes(o.t)).forEach(o=>c[o.t]=(c[o.t]||0)+1);const m=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===m);
  const sec=pre.length?X('Durante il voto sono morti in segreto: ','During the vote, these players secretly died: ')+pre.join(', ')+'. ':'';
  const skip=txt=>{G.lmsg=sec+txt;G.phase='lres';render()};
  if(m===0)return skip(X('Nessun voto: il rogo è saltato.','No votes: the stake is skipped.'));
  if(top.length>1){
    if(G.runoff)return skip(X('Pareggio anche al ballottaggio: il rogo è saltato.','Tie again in the runoff: the stake is skipped.'));
    G.runoff=true;G.cand=top;G.votes=[];G.vq=S.players.filter(p=>G.alive.includes(p));G.vi=0;G.shown=false;G.dg=null;G.phase='vote';render();return}
  const v=top[0];if(v==='__skip')return skip(X('La maggioranza ha scelto di saltare: nessuno viene eliminato.','The majority chose to skip: nobody is eliminated.'));
  const wv=facOf(v)==='wolf';VV().filter(o=>o.t===v).forEach(o=>{const vw=facOf(o.v)==='wolf';if(wv&&facOf(o.v)==='civ')addB(o.v,25);else if(!wv&&vw)addB(o.v,25)});
  vKill(v,sec);
}
function vKill(v,sec,mayor){const G=S.G;if(G.roles[v]==='joker')G.jokerWin=v;const t2=(G.roles[v]==='re'&&G.vassal&&G.alive.includes(G.vassal))?G.vassal:v;if(mayor&&facOf(t2)==='wolf')addB(mayor,50);lKill(t2);G.lmsg=sec+t2+X(' è stato eliminato dal rogo.',' was burned at the stake.');G.phase='lres';render()}
function vForce(x){const G=S.G,pre=[...G.news],sec=pre.length?X('Durante il voto sono morti in segreto: ','During the vote, these players secretly died: ')+pre.join(', ')+'. ':'';vKill(x,sec+X('Il Sindaco ('+G.mayorName+') ha scelto: ','The Mayor ('+G.mayorName+') chose: '),G.mayorName)}
function abOpen(k){S.G.ab={k,st:'who'};S.G.phase='abil';render()}
function abCancel(){const G=S.G;if(!G.mayorUsed)G.mayorName='';G.ab=null;G.phase='vsum';render()}
function abGo(){S.G.ab.st='priv';render()}
function abUse(){const G=S.G;G.mayorName=G.ab.who;G.ab.st='tgt';render()}
function abPick(x){const G=S.G,a=G.ab;if(a.st==='who'){a.who=x;a.st='gate';render()}else if(a.st==='tgt'){G.mayorUsed=true;G.ab=null;vForce(x)}}

  if(ph==='vote'){
    const v=G.vq[G.vi],r=G.roles[v],d=G.dg;
    if(!G.shown)return gate(v,G.vi,G.vq.length);
    let b;
    if(d&&d.st==='tgt')b=P(X('Chi vuoi colpire?','Who do you target?'))+lBtn(gOpts(v).t,'dgTgt')+B('dgBack()',X('Annulla','Cancel'),GR);
    else if(d&&d.st==='role')b=P(X('Che ruolo ha ','What role does ')+esc(d.t)+X('?',' have?'))+roleGrid('dgRole',gOpts(v).r)+B('dgBack()',X('Annulla','Cancel'),GR);
    else if(d)b=P(esc(d.msg))+B('dgBack()',al.includes(v)?X('Continua','Continue'):X('Nascondi e passa','Hide and pass'));
    else b=(G.runoff?P(X('Ballottaggio tra: ','Runoff between: ')+G.cand.map(vn).join(', ')):'')+P(X('Tocca a <b>','<b>')+esc(v)+X('</b>: chi elimini?','</b>, who do you vote to eliminate?')+' ('+(G.vi+1)+'/'+G.vq.length+')')+(VV().length?P(VV().map(o=>esc(o.v)+' → '+vn(o.t)).join(' · ')):'')+(G.runoff?lBtn(G.cand.filter(x=>x!=='__skip'),'vCast'):lBtn(al,'vCast'))+(!G.runoff||G.cand.includes('__skip')?B('vSkip()','⏭️ '+X('Salta la votazione','Skip the vote'),GR):'')+((r==='azzardo'||r==='pazzo')&&!G.gd[v]&&!G.runoff?B('dgOpen()','🎯 '+X('Indovina un ruolo (in segreto)','Guess a role (secretly)'),GR):'');
    return`<div class="space-y-3 py-2">${H('🗳️ '+X('Rogo','The stake'))}${noteB(v)}${b}</div>`;

  if(ph==='lres')return`<div class="space-y-4 text-center py-4">${H('🔥 '+X('Rogo','The stake'))}${P(esc(G.lmsg))}${B("lNext('night')",X('Continua','Continue'))}</div>`;

  }
  const ti={civ:X('Vincono i Civili! 🎉','The Villagers win! 🎉'),wolf:X('Vincono i Lupi! 🐺','The Wolves win! 🐺'),joker:X('Vince il Joker! 🃏','The Joker wins! 🃏'),pittore:X('Vince il Pittore! 🎨','The Painter wins! 🎨'),sopravvissuto:X('Vince il Sopravvissuto! 🛟','The Survivor wins! 🛟')}[G.win];

// --- Game Master umano ---
function setMode(m){S.mode=m;render()}
function gmN(){let n=(S.gmName||'').trim()||'GM';if(S.players.includes(n))n+=' (GM)';return n}
function PW(){return(S.mode==='gm'&&S.gmPlay&&S.game==='who_said')?[...S.players,gmN()]:S.players}
function canStart(){
  const g=S.game;if(!PLAYABLE.includes(g))return false;
  if((g==='who_said'?PW():S.players).length<(g==='lupus'?4:3))return false;
  const e=eff();if(g==='mrwhite'&&e.und+e.mw===0)return false;if(g==='lupus')return true;
  if(S.mode==='gm'){const m=S.gm,a=m.a.trim(),b=m.b.trim(),c=m.c.trim();
    if(g==='mrwhite')return!!a&&(!e.und||!!b)&&(!e.mw||!!c);
    if(g==='impostore')return!!a&&(!impN()||!!b);
    return!!a}
  return true;
}
function chk(){const b=$('start-btn');if(b)b.disabled=!canStart()}
function gmRand(){
  if(S.game==='mrwhite'){const cs=[...S.cfg.cats],cat=cs[rnd(cs.length)],p=pickPair(cat),off=S.lang==='it'?0:2,sw=rnd(2);S.gm.a=p[off+sw];S.gm.b=p[off+1-sw];S.gm.c=t('cat_'+cat)}
  else if(S.game==='impostore'){const tr=pickU(rnd(2)?IMP_GEN:IMP_HAND,x=>x.q);S.gm.a=tr.q;S.gm.b=tr.alt[rnd(tr.alt.length)][1]}
  else S.gm.a=pickWhoQ();
  render();
}
function modeUI(g){
  const b=m=>`<button onclick="setMode('${m}')" class="flex-1 py-2 rounded-lg text-xs font-bold ${S.mode===m?'bg-purple-600':'bg-slate-800 text-slate-400'}">${t(m==='auto'?'modeAuto':'modeGm')}</button>`;
  const IC='min-w-0 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500';
  const inp=(k,l,first)=>`<div><p class="text-[11px] text-slate-400 mb-1">${l}</p><div class="flex gap-2"><input autocomplete="off" value="${esc(S.gm[k])}" oninput="S.gm.${k}=this.value;chk()" class="flex-1 ${IC}">${first?`<button onclick="gmRand()" class="px-3 rounded-xl bg-slate-800 text-lg" title="${t('gmRand')}">🎲</button>`:''}</div></div>`;
  let x='';
  if(S.mode==='gm'){
    const e=eff();
    if(g==='mrwhite')x=inp('a',t('gmCiv'),1)+(e.und?inp('b',t('gmUnd')):'')+(e.mw?inp('c',t('gmHint')):'');
    else if(g==='impostore')x=inp('a',t('gmQCiv'),1)+(impN()?inp('b',t('gmQImp')):'');
    else x=inp('a',t('gmQ'),1)+`<div class="flex items-center justify-between text-xs font-bold pt-1"><span>${t('gmPlays')}</span><button onclick="S.gmPlay=!S.gmPlay;render()" class="px-3 py-1.5 rounded-lg ${S.gmPlay?'bg-purple-600':'bg-slate-800 text-slate-400'}">${S.gmPlay?'ON':'OFF'}</button></div>`+(S.gmPlay?`<input autocomplete="off" value="${esc(S.gmName)}" oninput="S.gmName=this.value;chk()" placeholder="${t('gmName')}" class="w-full ${IC}">`:'');
    x=`<p class="text-[11px] text-slate-400">${t(g==='who_said'?'gmInfoW':g==='lupus'?'gmInfoL':'gmInfo')}</p>`+(g==='lupus'?'':x);
  }
  return`<div class="pt-3 border-t border-slate-700/60 space-y-2"><p class="text-xs font-bold">${t('modeTitle')}</p><div class="flex gap-2">${b('auto')}${b('gm')}</div>${x}</div>`;
}
function applyGM(){
  const G=S.G,m=S.gm,a=m.a.trim(),b=m.b.trim(),g=S.game;
  if(g==='mrwhite'){const u=G.limits.und?b:a;G.pair=[a,u,a,u];G.swap=false;G.hint=G.limits.mw?m.c.trim():''}
  else if(g==='impostore'){G.qCiv=a;G.qImp=G.limits.imp?b:a}
  else{G.q=a;G.phase='wans'}
}
function newRound(){if(S.mode==='gm'){S.gm={a:'',b:'',c:''};S.G=null;S.sel=null;S.screen='setup';render()}else startGame()}
const _sg=startGame;startGame=function(){_sg();if(S.G&&S.screen==='play'&&S.mode==='gm'){applyGM();render()}};
function viewGM(){
  const G=S.G,g=S.game,inp=(id,l,v)=>`<div><p class="text-[11px] text-slate-400 mb-1">${l}</p><input autocomplete="off" id="${id}" value="${esc(v)}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"></div>`;
  let f='';
  if(g==='mrwhite')f=inp('gm1',t('gmCiv'),word('civ'))+(G.limits.und?inp('gm2',t('gmUnd'),word('und')):'')+(G.limits.mw?inp('gm3',t('gmHint'),t('cat_'+G.cat)):'');
  else if(g==='impostore')f=inp('gm1',t('gmQCiv'),G.qCiv)+(G.limits.imp?inp('gm2',t('gmQImp'),G.qImp):'');
  else f=inp('gm1',t('gmQ'),G.q);
  return`<div class="space-y-3"><h3 class="font-bold text-white">🎤 ${t('gmTitle')}</h3>${f}<button onclick="startGame()" class="w-full bg-slate-800 py-3 rounded-xl font-bold text-sm">${t('gmRand')}</button><button onclick="gmDone()" class="${BTN}">${t('gmOk')}</button></div>`;
}
function gmDone(){
  const G=S.G,g=S.game,v=i=>($('gm'+i)?$('gm'+i).value.trim():'');
  if(g==='mrwhite'){const c=v(1),u=G.limits.und?v(2):c,hh=G.limits.mw?v(3):'';if(!c||!u||(G.limits.mw&&!hh)){alert(t('gmNeed'));return}G.pair=[c,u,c,u];G.swap=false;G.hint=hh;G.phase='reveal'}
  else if(g==='impostore'){const a=v(1),b=G.limits.imp?v(2):a;if(!a||!b){alert(t('gmNeed'));return}G.qCiv=a;G.qImp=b;G.phase='ireveal'}
  else{const q=v(1);if(!q){alert(t('gmNeed'));return}G.q=q;G.phase='wans'}
  render();
}

// --- Chi l'ha detto? ---
const WSENS=['classic','hot','present','flirty','nsfw','dark'];
function toggleW(c){const s=S.cfg.wsens;if(s.has(c)){if(s.size>1)s.delete(c)}else s.add(c);render()}
function pickU(pool,key){let fr=pool.filter(x=>!S.used.has(key(x)));if(!fr.length){pool.forEach(x=>S.used.delete(key(x)));fr=pool}const x=fr[rnd(fr.length)];S.used.add(key(x));return x}
function pickWhoQ(){return pickU(WHO_ALL,x=>x)}
function startWho(){S.G={phase:'wq',q:pickWhoQ(),order:shuffle(PW()),idx:0,shown:false,ans:{},pick:null,votes:{},vi:0,awards:null};S.screen='play';render()}
function rerollWho(){S.G.q=pickWhoQ();render()}
function wGo(){S.G.phase='wans';render()}
function wSend(){const G=S.G,p=G.order[G.idx];const v=$('w-in').value.trim().slice(0,60);if(!v){$('w-in').focus();return}G.ans[p]=v;G.shown=false;G.idx++;if(G.idx>=G.order.length){G.pick=PW()[rnd(PW().length)];G.order=shuffle(PW());G.vi=0;G.phase='wvote'}render()}
function wVote(i){const G=S.G;G.votes[G.order[G.vi]]=PW()[i];G.vi++;if(G.vi>=G.order.length){G.awards={};PW().forEach(p=>{G.awards[p]=(p!==G.pick&&G.votes[p]===G.pick)?100:0;S.scores[p]=(S.scores[p]||0)+G.awards[p]});G.phase='wres'}render()}
function viewWho(){
  const G=S.G,n=PW().length;
  if(G.phase==='wq')return`<div class="space-y-4 py-2 text-center"><p class="text-xs text-slate-400">${t('question')}</p><h2 class="text-xl font-extrabold text-white">${esc(G.q)}</h2><button onclick="rerollWho()" class="w-full bg-slate-800 py-3 rounded-xl font-bold text-sm">${t('reroll')}</button>${S.quick?'':`<button onclick="wGo()" class="${BTN}">${t('start')}</button>`}</div>`;
  if(G.phase==='wans'){
    const p=G.order[G.idx];
    return !G.shown?`<div class="text-center space-y-5 py-6"><p class="text-slate-400 text-sm">${t('passTo')}</p><h2 class="text-3xl font-extrabold gtext">${esc(p)}</h2><button onclick="reveal()" class="${BTN}">${t('tapReveal')}</button><p class="text-xs text-slate-500">${G.idx+1}/${n}</p></div>`
    :`<div class="space-y-4 py-2"><p class="text-center text-slate-400 text-sm">${esc(p)}</p><h2 class="text-lg font-extrabold text-white text-center">${esc(G.q)}</h2><input autocomplete="off" id="w-in" oninput="$('w-btn').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')wSend()" placeholder="${t('ansPh')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-purple-500"><button id="w-btn" disabled onclick="wSend()" class="${BTN}">${t('send')}</button></div>`;
  }
  if(G.phase==='wvote'){
    const v=G.order[G.vi];
    return`<div class="space-y-3 py-2"><p class="text-xs text-slate-400 text-center">${esc(G.q)}</p><div class="bg-slate-900 rounded-xl p-4 text-center text-lg font-extrabold text-white">“${esc(G.ans[G.pick])}”</div><p class="text-center text-sm"><b class="gtext">${esc(v)}</b> · ${t('whoWrote')} (${G.vi+1}/${n})</p><div class="grid grid-cols-2 gap-2">${PW().map((p,i)=>p===v?'':`<button onclick="wVote(${i})" class="bg-slate-800 py-3 rounded-xl text-xs font-bold">${esc(p)}</button>`).join('')}</div></div>`;
  }
  return`<div class="space-y-3"><div class="bg-slate-900 rounded-xl p-4 text-center"><p class="text-lg font-extrabold text-white">“${esc(G.ans[G.pick])}”</p><p class="text-xs text-slate-400 mt-1">${t('author')}: <b class="text-pink-400">${esc(G.pick)}</b></p></div>
  ${PW().map(p=>`<div class="flex justify-between bg-slate-900 px-3 py-2 rounded-xl text-xs"><span>${esc(p)} → ${esc(G.votes[p])}</span><span>${p===G.pick?'':(G.votes[p]===G.pick?'✅':'❌')}</span></div>`).join('')}
  <p class="text-xs font-bold text-slate-400">${t('allAns')}</p>${PW().map(p=>`<div class="bg-slate-900/60 px-3 py-1.5 rounded-lg text-xs"><b>${esc(p)}</b>: ${esc(G.ans[p])}</div>`).join('')}
  <div class="flex flex-wrap gap-1.5 justify-center">${PW().filter(p=>G.awards[p]>0).map(p=>`<span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">${esc(p)} +${G.awards[p]}</span>`).join('')}</div>
  <button onclick="newRound()" class="${BTN}">${t('newRound')}</button></div>`;
}

// --- Impostore ---
const SENS=['classic','hot','present','flirty','nsfw','dark'];
function impN(){return Math.max(0,Math.min(S.cfg.imp,S.players.length-1))}
function stepImp(d){S.cfg.imp=Math.max(0,Math.min(impN()+d,Math.max(0,S.players.length-1)));render()}
function toggleSens(c){const s=S.cfg.sens;if(s.has(c)){if(s.size>1)s.delete(c)}else s.add(c);render()}
function startImp(){
  const n=S.players.length,k=impN(),tr=pickU(rnd(2)?IMP_GEN:IMP_HAND,x=>x.q),alt=tr.alt[rnd(tr.alt.length)][1];
  const list=shuffle([...Array(n-k).fill('civ'),...Array(k).fill('imp')]),roles={};
  shuffle(S.players).forEach((p,i)=>roles[p]=list[i]);
  const assign={};S.players.forEach(p=>assign[p]='pool');
  S.G={phase:'ireveal',order:shuffle(S.players),idx:0,shown:false,roles,qCiv:tr.q,qImp:alt,answers:{},assign,
    limits:{civ:n-k,imp:k},slots:[['civ','border-emerald-500/50'],['imp','border-rose-500/50']],awards:null,done:false};
  S.sel=null;S.screen='play';render();
}
function sendAns(){const G=S.G,p=G.order[G.idx];const v=$('ans-in').value.trim().slice(0,60);if(!v){$('ans-in').focus();return}G.answers[p]=v;G.shown=false;G.idx++;if(G.idx>=G.order.length)G.phase='idiscuss';render()}
function viewImp(){
  if(S.G.phase==='qdone')return viewQ();
  const G=S.G,n=S.players.length;
  if(G.phase==='ireveal'){
    const p=G.order[G.idx],q=G.roles[p]==='imp'?G.qImp:G.qCiv;
    return !G.shown?`<div class="text-center space-y-5 py-6"><p class="text-slate-400 text-sm">${t('passTo')}</p><h2 class="text-3xl font-extrabold gtext">${esc(p)}</h2><button onclick="reveal()" class="${BTN}">${t('tapReveal')}</button><p class="text-xs text-slate-500">${G.idx+1}/${n}</p></div>`
    :`<div class="space-y-4 py-2"><p class="text-center text-slate-400 text-sm">${esc(p)}</p><p class="text-xs text-slate-400 text-center">${t('yourQ')}</p><h2 class="text-xl font-extrabold text-white text-center">${esc(q)}</h2>${S.quick?`<button onclick="hideNext()" class="${BTN}">${t('hide')}</button>`:`<input autocomplete="off" id="ans-in" oninput="$('ans-btn').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')sendAns()" placeholder="${t('ansPh')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-purple-500"><button id="ans-btn" disabled onclick="sendAns()" class="${BTN}">${t('send')}</button>`}</div>`;
  }
  if(G.phase==='idiscuss')return`<div class="space-y-3"><h3 class="font-bold text-white">${t('answers')}</h3><p class="text-[11px] text-slate-400">${t('discussInfo')}</p>${G.order.map(p=>`<div class="bg-slate-900 px-3 py-2.5 rounded-xl text-xs"><b>${esc(p)}</b>: ${esc(G.answers[p])}</div>`).join('')}<button onclick="goVote()" class="${BTN}">${t('goVote')}</button></div>`;
  return`<div class="space-y-3"><h3 class="font-bold text-white">${t('result')}</h3>
  <div class="bg-slate-900 rounded-xl p-3 text-xs space-y-1"><p>${t('qCiv')}: <b>${esc(G.qCiv)}</b></p>${G.limits.imp?`<p>${t('qImp')}: <b>${esc(G.qImp)}</b></p>`:''}</div>
  ${S.players.map(p=>`<div class="bg-slate-900 px-3 py-2 rounded-xl text-xs"><div class="flex justify-between"><b>${esc(p)}</b><span>${t(G.roles[p])} ${G.assign[p]===G.roles[p]?'✅':'❌'}</span></div><div class="text-slate-400 mt-0.5">“${esc(G.answers[p])}”</div></div>`).join('')}
  <p class="text-sm font-bold text-center">${G.limits.imp?(G.allFound?t('allFound'):t('someFree')):t('noImp')}</p>
  <div class="flex flex-wrap gap-1.5 justify-center">${S.players.filter(p=>G.awards[p]>0).map(p=>`<span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">${esc(p)} +${G.awards[p]}</span>`).join('')}</div>
  <button onclick="newRound()" class="${BTN}">${t('newGame')}</button></div>`;
}

// --- viste ---
function viewHome(){
  return`<div class="space-y-4"><div class="text-center space-y-1 mb-4"><h2 class="text-2xl font-extrabold">${t('pickGame')}</h2><p class="text-slate-400 text-xs">${t('pickSub')}</p></div>
  ${GAMES.map(([id,ic,bd])=>`<div onclick="selectGame('${id}')" class="glass p-4 rounded-2xl cursor-pointer border ${bd} flex items-start gap-3.5">
    <div class="text-3xl">${ic}</div><div class="flex-1"><div class="flex items-center gap-2"><h3 class="font-bold text-white">${t('g_'+id)}</h3>${!PLAYABLE.includes(id)?`<span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">${t('soon')}</span>`:''}</div>
    <p class="text-xs text-slate-400 mt-1">${t('d_'+id)}</p></div></div>`).join('')}
  <div onclick="S.screen='online';render()" class="glass p-4 rounded-2xl cursor-pointer border border-cyan-500/30 flex items-start gap-3.5"><div class="text-3xl">🌐</div><div class="flex-1"><div class="flex items-center gap-2"><h3 class="font-bold text-white">Online</h3><span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">beta</span></div><p class="text-xs text-slate-400 mt-1">${X('Crea una stanza con un codice e gioca da telefoni diversi.','Create a room with a code and play from separate phones.')}</p></div></div></div>`;
}
function viewSetup(){
  const g=S.game,e=eff(),pl=S.players;
  let cfg='';if(g==='impostore')cfg=`<div class="space-y-3 pt-3 border-t border-slate-700/60"><div class="flex items-center justify-between text-xs font-bold"><span>${t('impCount')}</span><div class="flex items-center gap-3"><button onclick="stepImp(-1)" class="w-8 h-8 rounded-lg bg-slate-800">−</button><span class="w-4 text-center">${impN()}</span><button onclick="stepImp(1)" class="w-8 h-8 rounded-lg bg-slate-800">+</button></div></div></div>`;
  if(g==='mrwhite')cfg=`<div class="space-y-3 pt-3 border-t border-slate-700/60">
    <div class="flex items-center justify-between text-xs font-bold"><span>${t('undercover')}</span><div class="flex items-center gap-3"><button onclick="stepUnd(-1)" class="w-8 h-8 rounded-lg bg-slate-800">−</button><span class="w-4 text-center">${e.und}</span><button onclick="stepUnd(1)" class="w-8 h-8 rounded-lg bg-slate-800">+</button></div></div>
    <div class="flex items-center justify-between text-xs font-bold"><span>${t('mwOpt')}</span><div class="flex items-center gap-3"><button onclick="stepMw(-1)" class="w-8 h-8 rounded-lg bg-slate-800">−</button><span class="w-4 text-center">${e.mw}</span><button onclick="stepMw(1)" class="w-8 h-8 rounded-lg bg-slate-800">+</button></div></div>
    <div><p class="text-xs font-bold mb-2">${t('cats')}</p><div class="flex flex-wrap gap-1.5">${CATS.map(c=>`<button onclick="toggleCat('${c}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${S.cfg.cats.has(c)?'bg-purple-600':'bg-slate-800 text-slate-400'}">${t('cat_'+c)}</button>`).join('')}</div></div></div>`;
  return`<section class="glass p-4 rounded-2xl space-y-4">
  <div class="flex justify-between items-center border-b border-slate-700/60 pb-3"><h2 class="font-bold text-white">${t('g_'+g)}</h2><button onclick="back()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">← ${t('back')}</button></div>
  <div class="flex gap-2"><input autocomplete="off" id="pn" onkeydown="if(event.key==='Enter')addPlayer()" placeholder="${t('namePh')}" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"><button onclick="addPlayer()" class="gbtn px-4 rounded-xl font-bold text-xs">${t('add')}</button></div>
  <div class="flex justify-between text-[11px] font-bold text-slate-400 px-1"><span>${t('players').toUpperCase()} (${pl.length})</span><button onclick="clearPlayers()" class="text-rose-400">${t('clear')}</button></div>
  <div class="max-h-36 overflow-y-auto space-y-1.5">${pl.length?pl.map((p,i)=>`<div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-xl text-xs font-semibold"><span>${i+1}. ${esc(p)}</span><button onclick="removePlayer(${i})" class="text-slate-500 px-1">🗑</button></div>`).join(''):`<p class="text-xs text-slate-500 italic">${t('none')}</p>`}</div>
  ${PLAYABLE.includes(g)?modeUI(g):''}${g!=='lupus'&&PLAYABLE.includes(g)?quickUI():''}${cfg}
  ${PLAYABLE.includes(g)?'':`<p class="text-xs text-amber-300 text-center">${t('comingSoon')}</p>`}
  ${g==='mrwhite'&&e.und+e.mw===0?`<p class="text-xs text-amber-300 text-center">${t('needRole')}</p>`:''}
  <button id="start-btn" onclick="startGame()" ${canStart()?'':'disabled'} class="${BTN}">${t(g==='lupus'?'next':'start')}</button></section>`;
}
function chip(i){return`<button draggable="true" ondragstart="dragS(event,${i})" onclick="event.stopPropagation();pick(${i})" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${S.sel===i?'bg-purple-600 border-purple-400':'bg-slate-800 border-slate-600'}">${esc(S.players[i])}</button>`}
function viewPlay(){
  const G=S.G,n=S.players.length;let b='';
  const roleName=r=>t(r);
  if(G.phase==='gm'){b=viewGM()}else if(S.game==='mrwhite'&&['order','elim','guess','review','end','qdone'].includes(G.phase)){b=viewMW()}else if(S.game==='lupus'){b=viewLupus()}else if(S.game==='who_said'){b=viewWho()}else if(S.game==='impostore'&&G.phase!=='vote'){b=viewImp()}else if(G.phase==='reveal'){
    const p=G.order[G.idx],r=G.roles[p];
    b=!G.shown?`<div class="text-center space-y-5 py-6"><p class="text-slate-400 text-sm">${t('passTo')}</p><h2 class="text-3xl font-extrabold gtext">${esc(p)}</h2><button onclick="reveal()" class="${BTN}">${t('tapReveal')}</button><p class="text-xs text-slate-500">${G.idx+1}/${n}</p></div>`
    :`<div class="text-center space-y-4 py-4"><p class="text-slate-400 text-sm">${esc(p)}</p>${r==='mw'?`<h2 class="text-2xl font-extrabold text-pink-400">${t('youMw')}</h2><p class="text-sm text-slate-300">${t('noWord')}</p><div class="bg-slate-900 rounded-xl p-3 text-sm">${t('hint')}: <b>${G.hint||t('cat_'+G.cat)}</b></div>`:`<p class="text-xs text-slate-400">${t('yourWord')}</p><h2 class="text-4xl font-black text-white">${esc(word(r))}</h2>`}<button onclick="hideNext()" class="${BTN}">${t('hide')}</button></div>`;
  }else if(G.phase==='clues'){
    const done=G.cIdx>=n;
    b=(done?`<div class="space-y-2 py-2"><button onclick="moreRound()" class="w-full bg-slate-800 py-3 rounded-xl font-bold text-sm">${t('moreRound')}</button><button onclick="goVote()" class="${BTN}">${t('goVote')}</button></div>`
    :`<div class="space-y-3 py-2 text-center"><p class="text-xs text-slate-400">${t('round')} ${G.round} · ${G.cIdx+1}/${n}</p><h2 class="text-2xl font-extrabold gtext">${t('turnOf')} ${esc(G.cluePlayers[G.cIdx])}</h2><input autocomplete="off" id="clue-in" onkeydown="if(event.key==='Enter')submitClue()" placeholder="${t('clueLabel')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-purple-500"><button onclick="submitClue()" class="${BTN}">${t('next')}</button></div>`)
    +(G.clues.length?`<div class="mt-3 space-y-1"><p class="text-xs font-bold text-slate-400">${t('history')}</p>${G.clues.map(c=>`<div class="bg-slate-900 px-3 py-1.5 rounded-lg text-xs"><span class="text-slate-500">${c.r}.</span> <b>${esc(c.p)}</b>: ${esc(c.c)}</div>`).join('')}</div>`:'');
  }else if(G.phase==='vote'){
    const pool=S.players.map((p,i)=>i).filter(i=>G.assign[S.players[i]]==='pool');
    const slot=(role,cap,cls)=>{const inn=S.players.map((p,i)=>i).filter(i=>G.assign[S.players[i]]===role);
      return`<div ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,'${role}')" onclick="place('${role}')" class="slot rounded-xl border-2 border-dashed ${cls} p-2.5"><p class="text-[11px] font-bold mb-1.5">${roleName(role)} ${inn.length}/${cap}</p><div class="flex flex-wrap gap-1.5">${inn.map(chip).join('')}</div></div>`};
    b=`<div class="space-y-3"><h3 class="font-bold text-white">${t('voteTitle')}</h3><p class="text-[11px] text-slate-400">${t('swapInfo')}</p>
    <div ondragover="event.preventDefault()" ondrop="drop(event,'pool')" onclick="place('pool')" class="slot rounded-xl bg-slate-900 p-2.5"><p class="text-[11px] font-bold mb-1.5 text-slate-400">${t('unassigned')}</p><div class="flex flex-wrap gap-1.5">${pool.map(chip).join('')}</div></div>
    ${G.slots.filter(s=>G.limits[s[0]]>0).map(s=>slot(s[0],G.limits[s[0]],s[1])).join('')}
    <button onclick="confirmVote()" ${pool.length?'disabled':''} class="${BTN}">${t('confirm')}</button></div>`;
  }else{
    const needGuess=G.limits.mw&&G.guessed===null;
    b=`<div class="space-y-3"><h3 class="font-bold text-white">${t('result')}</h3>
    <div class="bg-slate-900 rounded-xl p-3 text-xs space-y-1"><p>${t('wordCiv')}: <b>${esc(word('civ'))}</b></p>${G.limits.und?`<p>${t('wordUnd')}: <b>${esc(word('und'))}</b></p>`:''}</div>
    <div class="space-y-1.5">${S.players.map(p=>`<div class="flex justify-between bg-slate-900 px-3 py-2 rounded-xl text-xs"><span class="font-bold">${esc(p)}</span><span>${roleName(G.roles[p])} ${G.assign[p]===G.roles[p]?'✅':'❌'}</span></div>`).join('')}</div>
    ${needGuess?`<div class="space-y-2 border-t border-slate-700/60 pt-3"><p class="text-xs font-bold text-pink-300">${t('mwGuess')}</p><input autocomplete="off" id="g-in" onkeydown="if(event.key==='Enter')guess()" placeholder="${t('guessPh')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-pink-500"><div class="flex gap-2"><button onclick="skipGuess()" class="flex-1 bg-slate-800 rounded-xl text-xs font-bold py-3">${t('skip')}</button><button onclick="guess()" class="${BTN} flex-[2]">${t('tryIt')}</button></div></div>`
    :`<p class="text-sm font-bold text-center">${G.allFound?t('allFound'):t('someFree')}${G.limits.mw?' '+(G.guessed?t('mwRight'):t('mwWrong')):''}</p>
    <div class="flex flex-wrap gap-1.5 justify-center">${S.players.filter(p=>G.awards[p]>0).map(p=>`<span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">${esc(p)} +${G.awards[p]}</span>`).join('')}</div>
    <button onclick="newRound()" class="${BTN}">${t('newGame')}</button>`}</div>`;
  }
  return`<section class="glass p-4 rounded-2xl space-y-3">${b}</section>`;
}
function render(){
  if(S.screen==='online'&&NET.game&&NET.game.g==='lupus'&&S.G)lupSync();
  const on='px-2 py-1 text-[11px] font-bold rounded-lg bg-purple-600 text-white',off='px-2 py-1 text-[11px] font-bold rounded-lg text-slate-400';
  $('lb-it').className=S.lang==='it'?on:off;$('lb-en').className=S.lang==='en'?on:off;
  const top=Object.entries(S.scores).sort((a,b)=>b[1]-a[1])[0];
  $('top').textContent=top&&top[1]>0?`${top[0]}: ${top[1]}`:t('points');
  document.documentElement.lang=S.lang;
  $('app').innerHTML=S.screen==='home'?viewHome():S.screen==='setup'?viewSetup():S.screen==='lroles'?viewLRoles():S.screen==='ltype'?(NET.lsetup?(setTimeout(()=>startLupus(1),0),''):viewLType()):S.screen==='online'?viewOnline():viewPlay();
}
render();
</script>
</body>
</html>
