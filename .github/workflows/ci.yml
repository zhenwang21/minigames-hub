name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # Stessa versione usata in locale: la build deve essere identica byte per byte.
      - name: Install terser 5.51.2
        run: |
          mkdir -p /tmp/mgast
          cd /tmp/mgast
          npm init -y > /dev/null
          npm install --no-audit --no-fund terser@5.51.2

      - name: Rebuild minified files
        env:
          TEMP: /tmp
        run: node build-min.js

      - name: Committed build must be up to date
        run: git diff --exit-code -- index.html "Minigames Hub.min.html"

      - name: Tests on the source
        run: node tests/run-all.js

      - name: Tests on the minified build
        run: node tests/run-all.js --min

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install browser tooling
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Playwright smoke and screenshot diff
        run: npm run test:e2e

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lighthouse budget
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

