<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--acc1:#a855f7;--acc2:#ec4899;--acc3:#6366f1;--btn1:#7c3aed;--btn2:#d946ef}
html[data-theme="oceano"]{--acc1:#22d3ee;--acc2:#38bdf8;--acc3:#818cf8;--btn1:#0891b2;--btn2:#2563eb}
html[data-theme="tramonto"]{--acc1:#fb923c;--acc2:#f43f5e;--acc3:#f59e0b;--btn1:#ea580c;--btn2:#db2777}
html[data-theme="bosco"]{--acc1:#34d399;--acc2:#84cc16;--acc3:#10b981;--btn1:#059669;--btn2:#16a34a}
html[data-theme="neon"]{--acc1:#22d3ee;--acc2:#a855f7;--acc3:#f0abfc;--btn1:#0891b2;--btn2:#7c3aed}
html[data-theme="ghiaccio"]{--acc1:#93c5fd;--acc2:#e0f2fe;--acc3:#38bdf8;--btn1:#1d4ed8;--btn2:#0ea5e9}
/* tema chiaro: testi scuri, superfici crema */
html[data-theme="carta"]{--acc1:#b45309;--acc2:#0f766e;--acc3:#9a3412;--btn1:#92400e;--btn2:#0f766e;color-scheme:light}
html[data-theme="carta"] body{background:#f7f2e8;color:#1c1917}
html[data-theme="carta"] .glass{background:rgba(255,252,245,.94);border-color:rgba(28,25,23,.14)}
html[data-theme="carta"] .bg-slate-900{background:#efe7d8}
html[data-theme="carta"] .bg-slate-800{background:#e7ddca}
html[data-theme="carta"] .bg-slate-700{background:#d6c9b2}
html[data-theme="carta"] .bg-slate-900\/40{background:rgba(28,25,23,.06)}
html[data-theme="carta"] .text-white{color:#1c1917!important}
html[data-theme="carta"] .text-slate-200,html[data-theme="carta"] .text-slate-300{color:#44403c!important}
html[data-theme="carta"] .text-slate-400,html[data-theme="carta"] .text-slate-500{color:#57534e!important}
html[data-theme="carta"] .text-emerald-400,html[data-theme="carta"] .text-emerald-300{color:#047857!important}
html[data-theme="carta"] .text-amber-400,html[data-theme="carta"] .text-amber-300{color:#92400e!important}
html[data-theme="carta"] .text-rose-400{color:#be123c!important}
html[data-theme="carta"] .text-cyan-300{color:#0e7490!important}
html[data-theme="carta"] .text-purple-200{color:#6b21a8!important}
html[data-theme="carta"] .bg-purple-600\/30{background:rgba(147,51,234,.16)}
html[data-theme="carta"] .border-slate-700{border-color:rgba(28,25,23,.18)}
html[data-theme="carta"] input,html[data-theme="carta"] select,html[data-theme="carta"] textarea{color:#1c1917;background:#fffdf8;border-color:rgba(28,25,23,.2)}
/* ogni tema tinge anche lo sfondo, così i preset si distinguono davvero */
html[data-theme="oceano"] body{background:#04141d}
html[data-theme="tramonto"] body{background:#1a0e13}
html[data-theme="bosco"] body{background:#06140f}
html[data-theme="neon"] body{background:#0a0616}
html[data-theme="ghiaccio"] body{background:#07131f}
html[data-theme="carta"] body{background:#f7f2e8}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0b0f19;color:#f8fafc;-webkit-tap-highlight-color:transparent}
.glass{background:rgba(17,24,39,.85);border:1px solid rgba(255,255,255,.08)}
.gtext{background:linear-gradient(135deg,var(--acc1),var(--acc2) 50%,var(--acc3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gbtn{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff}
/* cosmetics: accento per gioco (identità visiva, separato dal tema scelto) */
#app{--ga:#a855f7;--gb:#ec4899;position:relative;isolation:isolate}
#app[data-game]:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:1rem;background:radial-gradient(110% 45% at 50% 0,var(--ga),transparent 70%);opacity:.12}
#app[data-game]:before{content:"";display:block;height:.28rem;border-radius:999px;background:linear-gradient(90deg,var(--ga),var(--gb));margin:0 0 .45rem;opacity:.85}
.gtile{width:3rem;height:3rem;flex:0 0 3rem;display:flex;align-items:center;justify-content:center;border-radius:.9rem;background:linear-gradient(135deg,var(--ga),var(--gb));box-shadow:0 8px 22px -12px var(--ga);font-size:1.7rem}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.35rem;height:1.35rem;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(148,163,184,.18);font-size:.78rem;line-height:1;flex:0 0 1.35rem}
.av.lg{width:1.7rem;height:1.7rem;font-size:1rem;flex-basis:1.7rem}
@media (prefers-reduced-motion:no-preference){.gcard{transition:transform .16s ease,box-shadow .16s ease}.gcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px #000}}
@keyframes cpop{0%{transform:scale(.96);opacity:.5}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.celebrate{animation:cpop .45s ease-out}
/* scelta del tema: mini anteprima invece del solo pallino */
.theme-card{display:flex;align-items:center;gap:.5rem;background:#0f172a;border:1px solid #334155;border-radius:.75rem;padding:.4rem .5rem;font-size:.68rem;font-weight:700;color:#cbd5e1;text-align:left}
.theme-card.on{border-color:#34d399;color:#fff}
.theme-card .tp{width:1.7rem;height:1.7rem;border-radius:.5rem;flex:0 0 1.7rem;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
html[data-theme="carta"] .theme-card{background:#fffdf8;border-color:rgba(28,25,23,.16);color:#44403c}
html[data-theme="carta"] .theme-card.on{border-color:#0f766e;color:#1c1917}
/* font arrotondato di sistema, senza scaricare nulla */
html[data-font="round"] body{font-family:ui-rounded,'SF Pro Rounded','Nunito',system-ui,sans-serif}
/* logo: riflesso lento, fermo con le animazioni disattivate */
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.logo-shine{background-size:200% auto;animation:shine 7s linear infinite}
html[data-motion="off"] .logo-shine{animation:none}
/* ingresso schermata: una sola volta per cambio di schermata */
@keyframes screenin{0%{opacity:.35;transform:translateY(6px)}100%{opacity:1;transform:none}}
#app.screen-in{animation:screenin .26s ease-out}
html[data-motion="off"] #app.screen-in{animation:none}
/* podio: barra colorata per le prime tre posizioni */
.podium-1{box-shadow:inset 3px 0 0 #fbbf24}
.podium-2{box-shadow:inset 3px 0 0 #cbd5e1}
.podium-3{box-shadow:inset 3px 0 0 #d97706}
/* coriandoli di fine partita: solo decorativi, nessuno stato salvato */
.confetti{position:fixed;inset:0;z-index:64;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:.5rem;height:.8rem;border-radius:2px;opacity:.95;animation:confetti 1.9s cubic-bezier(.2,.7,.4,1) forwards}
.confetti[data-kind="dots"] i{border-radius:50%;width:.45rem;height:.45rem}
.confetti[data-kind="stars"] i{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.av.host{box-shadow:0 0 0 2px #fbbf24,0 0 10px -2px #fbbf24}
.av.win{box-shadow:0 0 0 2px #34d399}
html[data-theme="carta"] .av{background:rgba(28,25,23,.08);border-color:rgba(28,25,23,.3)}
@keyframes confetti{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--dx,0),110vh,0) rotate(var(--rot,540deg));opacity:.15}}
html[data-motion="off"] .confetti{display:none}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@keyframes flipin{0%{transform:scaleX(.88);opacity:.35}100%{transform:scaleX(1);opacity:1}}
.flipin{animation:flipin .3s ease-out}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#upd{position:fixed;left:.6rem;right:.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + .6rem);z-index:70;display:none;align-items:center;gap:.5rem;background:#111827;border:1px solid var(--acc1);border-radius:1rem;padding:.55rem .8rem;box-shadow:0 12px 34px rgba(0,0,0,.55);font-size:.75rem;font-weight:700}
#upd.on{display:flex}
#upd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#upd button{border-radius:.6rem;padding:.35rem .6rem;font-size:.7rem;font-weight:800;background:#1e293b;color:#e2e8f0}
#upd button.go{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff}
#off{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + .5rem);transform:translateX(-50%);z-index:75;display:none;align-items:center;gap:.4rem;background:#78350f;border:1px solid #f59e0b;border-radius:999px;padding:.3rem .7rem;font-size:.7rem;font-weight:800;color:#fef3c7;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#off.on{display:flex}
/* testo grande/piccolo: le utility in rem scalano con la radice, quelle in px hanno un override */
html[data-text="l"]{font-size:18px}
html[data-text="s"]{font-size:15px}
html[data-text="l"] .text-\[10px\]{font-size:12px}
html[data-text="l"] .text-\[11px\]{font-size:13px}
html[data-text="s"] .text-\[10px\]{font-size:9px}
html[data-text="s"] .text-\[11px\]{font-size:10px}
/* alto contrasto */
html[data-contrast="high"] body{background:#000;color:#fff}
html[data-contrast="high"] .glass{background:#0b1120;border-color:rgba(255,255,255,.45)}
html[data-contrast="high"] .bg-slate-900{background:#020617}
html[data-contrast="high"] .text-slate-300,html[data-contrast="high"] .text-slate-400,html[data-contrast="high"] .text-slate-500{color:#e5e7eb!important}
html[data-contrast="high"] .gbtn{box-shadow:inset 0 0 0 2px #fff}
html[data-contrast="high"] .gtext{background:none;-webkit-text-fill-color:#fff;color:#fff}
@media (prefers-contrast:more){
 html[data-theme] body{background:#000;color:#fff}
 body{background:#000;color:#fff}
 .glass{background:#0b1120;border-color:rgba(255,255,255,.55)}
 .bg-slate-900{background:#020617}
 .text-slate-300,.text-slate-400,.text-slate-500{color:#e5e7eb!important}
 .gbtn{box-shadow:inset 0 0 0 2px #fff}
 .gtext{background:none;-webkit-text-fill-color:#fff;color:#fff}
}
/* riduci animazioni su richiesta, oltre alla preferenza di sistema */
html[data-motion="off"] *,html[data-motion="off"] :before,html[data-motion="off"] :after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (max-width:430px){#top{display:none}}
.gbtn:disabled{opacity:.4}
.gbtn:active{transform:translateY(1px)}
.slot{min-height:64px;transition:background .2s}
.slot.over{background:rgba(168,85,247,.2)}
/* Tailwind qui è compilato inline: se aggiungi classi nuove, aggiungile a mano qui sotto */
.py-8{padding-top:2rem;padding-bottom:2rem}
.px-6{padding-left:1.5rem;padding-right:1.5rem}
.text-slate-200{color:#e2e8f0}
input{-webkit-user-select:text;user-select:text}
/* Timer di discussione (facoltativo) */
#tmr{position:fixed;right:.6rem;bottom:calc(env(safe-area-inset-bottom,0px) + .6rem);z-index:60;display:none;pointer-events:none}
#tmr.on{display:flex;align-items:center;gap:.35rem}
#tmr .tmr-box{pointer-events:auto;display:flex;align-items:center;gap:.35rem;background:#0f172a;border:1px solid #334155;border-radius:999px;padding:.3rem .4rem .3rem .7rem;font-size:.75rem;font-weight:700;color:#f8fafc;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tmr .tmr-box.fin{border-color:#f43f5e;color:#fda4af}
#tmr button{background:#1e293b;border-radius:999px;padding:.15rem .5rem;font-size:.7rem;color:#cbd5e1}
body.tmon main{padding-bottom:3.2rem}
/* timer automatico del round (Nomi, Cose e Città) */
#tmr .tmr-box.auto{font-size:1rem;padding:.45rem .9rem;font-variant-numeric:tabular-nums}
/* utility di Tailwind mancanti nel CSS compilato */
.h-2{height:.5rem}
.rounded{border-radius:.25rem}
.mt-1\.5{margin-top:.375rem}
.space-y-1\.5>:not([hidden])~:not([hidden]){margin-top:.375rem}
.bg-emerald-600{background-color:rgb(5 150 105)}
.bg-emerald-600\/10{background-color:rgba(5,150,105,.1)}
.bg-emerald-600\/30{background-color:rgba(5,150,105,.3)}
.border-emerald-500\/30{border-color:rgba(16,185,129,.3)}
.border-rose-500\/30{border-color:rgba(244,63,94,.3)}
/* accessibilità */
:focus-visible{outline:3px solid #facc15;outline-offset:2px}
button,a,input,select,textarea{touch-action:manipulation}
.gbtn{min-height:44px}
.text-slate-500{color:#94a3b8}
.text-slate-400{color:#cbd5e1}
@media (prefers-reduced-motion:reduce){*,:before,:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
#modal svg{width:100%;height:auto;display:block}
.bg-orange-600\/20{background-color:rgba(234,88,12,.2)}
.border-orange-500\/40{border-color:rgba(249,115,22,.4)}
.bg-sky-600\/20{background-color:rgba(2,132,199,.2)}
.border-sky-500\/40{border-color:rgba(14,165,233,.4)}
.border-sky-500\/30{border-color:rgba(14,165,233,.3)}
.bg-rose-600\/20{background-color:rgba(225,29,72,.2)}
</style>

<header class="w-full max-w-2xl mx-auto flex items-center justify-between gap-2 py-2.5 px-3 glass rounded-2xl mb-3">
  <button onclick="goHome()" class="flex items-center gap-2" aria-label="Minigames Hub"><span class="text-xl" aria-hidden="true">🎭</span><span class="font-extrabold text-base gtext logo-shine">MINIGAMES HUB</span></button>
  <div class="flex items-center gap-1.5">
    <div class="bg-slate-800 rounded-xl p-0.5 flex">
      <button id="lb-it" onclick="setLang('it')" aria-label="Italiano" class="px-2 py-1 text-[11px] font-bold rounded-lg">🇮🇹 IT</button>
      <button id="lb-en" onclick="setLang('en')" aria-label="English" class="px-2 py-1 text-[11px] font-bold rounded-lg">🇬🇧 EN</button>

</header>

// Ripresa dopo reload/standby: la sessione dura al massimo due ore.
const RESUME_TTL = 2 * 60 * 60 * 1000;
let RESUME = { room: null, snap: null, savedAt: 0, lastKey: '' };
function loadSession() {
  try {
    const raw = localStorage.getItem('mgh_session_v1');
    if (!raw) return;
    const d = JSON.parse(raw) || {};
    const at = +d.at || 0;
    if (!at || Date.now() - at > RESUME_TTL) {
      localStorage.removeItem('mgh_session_v1');
      return;
    }
    const r = d.room || {};
    if (/^[A-Z0-9]{5}$/.test(String(r.code || '')) && typeof r.name === 'string' && r.name)
      RESUME.room = {
        code: String(r.code).toUpperCase(),
        name: r.name,
        host: !!r.host,
        players: Array.isArray(r.players) ? r.players.slice(0, 16) : [],
        n: +r.n || (Array.isArray(r.players) ? r.players.length : 0),
        at: at
      };
    const s = d.snap;
    if (s && /^[A-Z0-9]{5}$/.test(String(s.code || '')) && Array.isArray(s.players)) RESUME.snap = s;
  } catch (e) {}
}
function saveSession(force) {
  try {
    if (S.demo) return;
    if (NET.st === 'idle' || !NET.code || !NET.name) return;
    if (RESUME.muted && RESUME.muted === NET.code) return;
    const now = Date.now();
    if (!force && now - RESUME.savedAt < 1200) return;
    RESUME.savedAt = now;
    const room = {
      code: NET.code,
      name: NET.name,
      host: !!NET.host,
      players: NET.players.slice(0, 16),
      n: NET.players.length,
      at: now
    };
    const data = { at: now, room: room };
    if (NET.host) {
      try {
        data.snap = netSnap();
        data.snap.at = now;
      } catch (e) {}
    }
    const key = JSON.stringify(data);
    if (key === RESUME.lastKey) return;
    RESUME.room = room;
    if (data.snap) RESUME.snap = data.snap;
    try {
      localStorage.setItem('mgh_session_v1', key);
    } catch (e) {
      // Spazio esaurito: tengo almeno il codice stanza, senza lo snapshot.
      delete data.snap;
      RESUME.snap = null;
      const small = JSON.stringify(data);
      localStorage.setItem('mgh_session_v1', small);
      RESUME.lastKey = small;
      return;
    }
    RESUME.lastKey = key;
  } catch (e) {}
}
function clearSession() {
  RESUME = { room: null, snap: null, savedAt: 0, lastKey: '' };
  try {
    localStorage.removeItem('mgh_session_v1');

}
function netLoad(cb) {
  if (window.Peer) return cb();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload = cb;
  s.onerror = () => netFail({ type: 'lib' });
  document.head.appendChild(s);
}
function netReset() {

    clearTimeout(NET.elecT);

    NET.roomPeer && NET.roomPeer.destroy();
  } catch (e) {}
  try {
    NET.conn && NET.conn.close();
  } catch (e) {}
  try {
    NET.peer && NET.peer.destroy();
  } catch (e) {}

function netFail(e) {

  }[e.type];
  const er = m || X('Errore di connessione: ', 'Connection error: ') + (e.type || e);
  netReset();
  NET.err = er;
  render();

function tryCode(k) {
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',
    code = Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => al[b % 32]).join(''),
    p = new Peer('mgh-' + code);
  NET.peer = p;
  p.on('open', () => {
    RESUME.muted = '';
    NET.host = true;
    NET.code = code;
    NET.pin = '';
    NET.hostName = NET.name;
    NET.origHost = NET.name;
    NET.players = [NET.name];
    NET.order = [NET.name];
    NET.peers = { [NET.name]: p.id };
    NET.st = 'lobby';
    if (NET.pendingSnap) {
      // Il codice precedente non era più disponibile: ripristino lo stato nel nuovo codice.
      const s = NET.pendingSnap;
      NET.pendingSnap = null;
      s.code = code;
      s.host = NET.name;
      restoreState(s, code, p);
      NET.notice = X(
        'Il codice precedente non era più libero: questa stanza ha un codice nuovo.',
        'The previous code was no longer free: this room has a new code.'

    }
    render();
  });
  p.on('error', (e) => {
    if (e.type === 'unavailable-id' && k < 5) {
      try {
        p.destroy();

function netIncoming(c) {

    return;
  }
  // Sto già cercando di rientrare: chi mi contatta lo sta facendo per l'elezione,
  // quindi l'host è sparito anche per lui. Prendo il comando invece di rifiutarlo,
  // altrimenti mi salta e restiamo con due host separati.
  if (NET.st === 'recover' || !NET.conn) {
    NET.recovering = false;

function hostMsg(c, m) {

      if (NET.conns[c._n] === c) netResync(c._n);
      return;

    if (NET.conns[c._n] === c) hostApply(c._n, m);
    return;
  }
  if (!m) return;
  const n = cleanName(m.name, 16);
  if (m.v !== APP_VERSION) {
    c.send({ t: 'rej', why: 'version' });
    setTimeout(() => c.close(), 100);
    return;
  }
  if (!n) {
    c.send({ t: 'rej', why: 'name' });
    setTimeout(() => c.close(), 100);
    return;
  }
  if (!pinOk(m.pin)) {
    c.send({ t: 'rej', why: 'pin' });
    setTimeout(() => c.close(), 100);
    return;
  }

    if (i >= 0 && i < AV_E.length) S.avMap[n] = i;
  }

  if (ex && ex === NET.origHost && NET.hostName !== ex) return netHandback(c, ex);

    const old = NET.conns[ex];

    const stale = old && old !== c && old.open === false;
    if (stale) {

        old.close();
      } catch (e) {}
      delete NET.conns[ex];
    }
    if (!NET.offline[ex] && !NET.gone[ex] && NET.conns[ex]) {
      c.send({ t: 'rej', why: 'name' });
      setTimeout(() => c.close(), 100);
      return;
    }
    try {
      NET.conns[ex] && NET.conns[ex] !== c && NET.conns[ex].close();
    } catch (e) {}
    if (NET.offT[ex]) {
      clearTimeout(NET.offT[ex]);
      delete NET.offT[ex];
    }
    delete NET.offline[ex];
    delete NET.gone[ex];
    c._n = ex;
    NET.conns[ex] = c;
    NET.peers[ex] = c.peer;
    c.send({
      t: 'lobby',
      players: NET.players,
      host: NET.hostName,
      you: ex,
      peers: NET.peers,
      order: NET.order,
      avs: S.avMap

    netResync(ex);
    return;

    c.send({ t: 'rej', why: 'started' });
    setTimeout(() => c.close(), 100);
    return;
  }
  if (NET.players.length >= 16) {
    c.send({ t: 'rej', why: 'full' });
    setTimeout(() => c.close(), 100);
    return;
  }

  NET.conns[n] = c;
  NET.players.push(n);

  netPresence();
}
function netResync(n) {

    if (S.G) lupSync();
    return;
  }
  if (G.g === 'imp') return iBc();
  if (G.g === 'mw') return mwBc();
  if (G.g === 'pv') return pvBc();
  if (G.g === 'nc') return ncBc();

  NET.players = NET.players.filter((x) => !g.includes(x));
  NET.order = NET.order.filter((x) => !g.includes(x));
  g.forEach((x) => {
    delete NET.gone[x];
    delete NET.peers[x];
    try {

function netJoin(codeArg, nameArg) {

  const code = String(codeArg || (el && el.value) || NET.lastCode || '')
    .trim()
    .toUpperCase();
  if (!netOk(nameArg)) return;
  if (code.length < 5) {
    NET.st = 'idle';
    NET.err = X('Inserisci il codice stanza (5 caratteri).', 'Enter the room code (5 characters).');
    return render();
  }
  const pe = $('on-pin');
  NET.pin = pinClean(pe ? pe.value : NET.pin);
  NET.lastCode = code;
  netLoad(() => {
    const p = new Peer();
    NET.peer = p;
    p.on('error', netFail);
    p.on('connection', netIncoming);
    p.on('open', () => {
      const c = p.connect('mgh-' + code, { reliable: true });
      NET.conn = c;
      let joined = false;
      const to = setTimeout(() => {
        if (!joined) netFail({ type: 'timeout' });
      }, 12000);
      c.on('open', () => {
        c.send(joinPayload());
      });
      c.on('data', (m) => {
        if (m.t === 'lobby') {
          clearTimeout(to);
          joined = true;
          netAdopt(c, m, code);

        clearTimeout(to);

  p.on('open', () => restoreState(s, s.code, p));

  NET.peers = { ...(s.peers || {}) };

  if (NET.host || NET.conn || !code || !NET.peer || NET.peer.destroyed) return cb(false);

    done = false,
    joined = false,
    to = null;
  const finish = (ok) => {
    if (done) return;
    done = true;
    clearTimeout(to);
    if (!ok) {
      try {
        c && c.close();
      } catch (e) {}
    }
    cb(ok);

  try {
    c = NET.peer.connect('mgh-' + code, { reliable: true });
  } catch (e) {
    return cb(false);
  }
  to = setTimeout(() => finish(false), 2500);
  c.on('open', () => {
    try {
      c.send(joinPayload());
    } catch (e) {
      finish(false);
    }
  });

    if (joined) return netClientMsg(m, c);
    if (m && m.t === 'lobby') {
      joined = true;
      finish(true);
      netAdopt(c, m, code);
      return;
    }
    if (m && m.t === 'rej' && m.why === 'name' && tryN < 2) {

      done = true;

        c.close();

  if (m.t === 'presence') {
    NET.off = m.offline || [];
    if (m.peers) NET.peers = m.peers;
    if (m.order) NET.order = m.order;
    return render();
  }
  if (m.t === 'standby') {
    NET.mirror = m.snap;
    return;
  }
  if (m.t === 'moved') {
    if (m.host) NET.peers[m.name] = m.host;
    NET.hostName = m.name || NET.hostName;
    NET.elec = true;
    NET.st = 'elect';
    render();
    return netTry([m.name], 0);
  }
  if (m.t === 'become') {
    // L'host originale è tornato: riprendo il comando.
    return netPromote(m.snap, c);
  }
  if (m.t === 'closed') {
    netReset();
    clearSession();
    NET.err = X("L'host ha chiuso la stanza.", 'The host closed the room.');
    return render();
  }
  if (m.t === 'kick') {
    netReset();
    clearSession();
    NET.err = X('Sei stato espulso dalla stanza.', 'You were kicked from the room.');
    return render();
  }
  if (m.t === 'rej') {
    netReset();
    if (m.why !== 'version') clearSession();
    NET.err =
      m.why === 'full'
        ? X('Stanza piena.', 'Room is full.')
        : m.why === 'started'
          ? X(
              "La partita è già iniziata o il tuo posto è scaduto: chiedi all'host di tornare in lobby.",
              'The game has already started or your seat expired: ask the host to go back to the lobby.'

          : m.why === 'pin'
            ? X('PIN della stanza errato o mancante.', 'Wrong or missing room PIN.')
            : m.why === 'version'
            ? X(
                'Versione non aggiornata. Ricarica la pagina!',
                'Outdated version. Reload the page!'

            : X('Nome già usato o non valido.', 'Name already used or invalid.');
    return render();
  }

    NET.scores = { ...(m.scores || {}) };
    S.scores = { ...(m.scores || {}) };
    if (NET.view) NET.view.scores = { ...NET.scores };
    return render();
  }
  if (m.t === 'nct') {
    if (NET.view && NET.view.t === 'nc') {

      if (m.end) NET.view.end = m.end;

    return;

    return;

    NET.ncStamp = m.stamp;

    const txt = cleanText(m.text, 600);
    if (txt) {
      NET.note = { text: txt, from: cleanName(m.from, 16) };
      announce(t('noteTitle'));
      render();
    }
    return;
  }
  netView(m);

function netKick(i) {

  const n = NET.players[i];

  if (!confirm(X('Espellere ' + n + ' dalla stanza?', 'Kick ' + n + ' from the room?'))) return;
  const c = NET.conns[n];
  try {
    c && c.send({ t: 'kick' });
  } catch (e) {}
  setTimeout(() => {
    try {
      c && c.close();
    } catch (e) {}
  }, 150);
  if (NET.offT[n]) {
    clearTimeout(NET.offT[n]);
    delete NET.offT[n];
  }
  delete NET.conns[n];
  delete NET.peers[n];
  delete NET.offline[n];
  delete NET.gone[n];
  NET.players = NET.players.filter((x) => x !== n);
  NET.order = NET.order.filter((x) => x !== n);
  NET.off = [...Object.keys(NET.offline), ...Object.keys(NET.gone)];

function netMovePlayer(i, dir) {
  if (!NET.host || NET.game) return;
  const j = i + (+dir || 0),
    P = NET.players;
  if (i < 0 || j < 0 || i >= P.length || j >= P.length) return;
  const a = P[i],
    b = P[j];
  P[i] = b;
  P[j] = a;
  const oi = NET.order.indexOf(a),
    oj = NET.order.indexOf(b);
  if (oi >= 0 && oj >= 0) {
    NET.order[oi] = b;
    NET.order[oj] = a;
  }
  NET.lastSnap = '';
  hostBc();
  netPresence();
}
// Passaggio volontario del comando: l'host sceglie chi continua la stanza.
function netPassHost(i) {
  if (!NET.host || NET.game) return;
  const name = NET.players[i];
  if (!name || name === NET.name) return;
  const c = NET.conns[name];
  if (!c) {
    alert(X(name + ' è offline: riprova quando rientra.', name + ' is offline: try again when they are back.'));
    return;
  }
  if (!confirm(X('Passare il comando a ' + name + '?', 'Pass control to ' + name + '?'))) return;
  const snap = netSnap();
  snap.origHost = name;
  c._n = name;
  try {
    c.send({ t: 'become', snap });
  } catch (e) {}
  const others = Object.values(NET.conns).filter((x) => x !== c);
  others.forEach((x) => {
    try {
      x.send({ t: 'moved', host: c.peer, name });
    } catch (e) {}
  });
  NET.conn = c;
  NET.conns = {};
  NET.view = null;
  NET.host = false;
  NET.hostName = name;
  NET.peers[name] = c.peer;
  NET.elec = true;
  NET.st = 'elect';
  NET.err = X('Comando passato a ' + name + '.', 'Control passed to ' + name + '.');
  c.on('data', (m) => netClientMsg(m, c));
  c.on('close', () => {
    if (NET.host || NET.conn !== c) return;
    NET.conn = null;
    NET.elec = true;
    NET.st = 'elect';
    netTry([name], 0);
  });
  setTimeout(() => {
    try {
      NET.roomPeer && NET.roomPeer.destroy();
    } catch (e) {}
    NET.roomPeer = null;
    clearTimeout(NET.roomT);
    others.forEach((x) => {
      try {
        x.close();
      } catch (e) {}
    });
  }, 150);
  render();
}

function cDel(id) {
  CUST = CUST.filter((c) => c.id !== id);

    const i = a.indexOf(id);
    if (i >= 0) a.splice(i, 1);

  l.must.delete(id);

  const A = window.AudioContext || window.webkitAudioContext;

function tone(c, f, at, dur, wave, level) {
  const o = c.createOscillator(),
    g = c.createGain();
  o.type = wave;
  o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(level, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(c.destination);
  o.start(at);
  o.stop(at + dur + 0.02);
}

function tmBeep(last) {
  if (!sndReady()) return;
  try {
    const c = sndCtx();
    if (!c) return;
    const cfg = sndCfg(),
      at = c.currentTime;
    tone(c, last ? 660 : 880, at, last ? 0.3 : 0.14, cfg.wave, sndLevel(last ? cfg.level * 1.2 : cfg.level * 0.8));
    if (last) {
      tone(c, 880, at + 0.16, 0.32, cfg.wave, sndLevel(cfg.level * 1.2));
      tone(c, 1100, at + 0.34, 0.38, cfg.wave, sndLevel(cfg.level * 1.2));
    }
    releaseCtx(c, 1000);
  } catch (e) {}
}

// --- casualità sicura: Fisher-Yates + crypto ---
function rnd(n) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}
function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// --- Smart Swap: se lo slot è pieno, l'occupante prende il posto precedente del giocatore spostato ---
function smartSwap(asg, p, role, limits) {
  const n = { ...asg },
    prev = n[p] || 'pool';
  if (prev === role) return n;
  const occ = Object.keys(n).filter((x) => n[x] === role);
  if (limits[role] != null && occ.length >= limits[role]) n[occ[0]] = prev;
  n[p] = role;
  return n;
}

function eff() {

    max = Math.max(1, Math.floor(n / 3)),

}
function stepMw(d) {

const ARTS = [
  'il',
  'lo',
  'la',
  'l',
  'i',
  'gli',
  'le',
  'un',
  'uno',
  'una',
  'the',
  'a',
  'an',
  'di',
  'del',
  'della'
];
function lev(a, b) {
  const m = a.length,
    n = b.length,
    d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(
        d[i - 1][j] + 1,
        d[i][j - 1] + 1,
        d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
  return d[m][n];
}
function nrm2(s) {
  return s
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .split(/\s+/)
    .filter((x) => x && !ARTS.includes(x))
    .join(' ');
}
function near(a, b) {
  if (a === b) return true;
  const L = Math.max(a.length, b.length),
    d = lev(a, b);
  if (L >= 8) return d <= 2;
  if (L >= 5) return d <= 1;
  return L === 4 && d === 1 && a.slice(0, 3) === b.slice(0, 3);
}
function matchLevel(g, w) {
  const a = nrm2(g),
    b = nrm2(w);
  if (!a || !b) return 'no';
  if (near(a.replace(/ /g, ''), b.replace(/ /g, ''))) return 'yes';
  let ta = a.split(' '),
    tb = b.split(' ');
  if (ta.length > tb.length) [ta, tb] = [tb, ta];
  if (ta.join('').length >= 4 && ta.every((x) => tb.some((y) => near(x, y)))) return 'yes';
  return 'no';
}
function mwGuess() {
  const G = S.G,
    raw = $('g-in').value.trim();

    $('g-in').focus();
    return;
  }
  if (
    [G.pair[G.swap ? 1 : 0], G.pair[2 + (G.swap ? 1 : 0)]].some((w) => matchLevel(raw, w) === 'yes')
  ) {
    G.guessed = true;
    G.winner = 'imp';
    mwEnd();
    return;
  }
  G.guessTxt = raw;
  G.phase = 'review';
  render();
}
function mwReview(ok) {

// --- Lupus in Fabula ---
const LT = {

const CORE = ['dottore', 'veggente', 'spiritualista'],
  SPEC_C = ['kamikaze', 're', 'sindaco', 'azzardo'],
  SPEC_W = ['fantasma', 'mannaro', 'pazzo'],
  SPEC_T = ['joker', 'pittore', 'sopravvissuto'];
const LCOL = { civ: 'text-emerald-400', wolf: 'text-rose-400', third: 'text-amber-400' };
const L = () =>
  S.lc ||
  (S.lc = {
    wolves: null,
    on: new Set([...CORE, ...SPEC_C, ...SPEC_W, ...SPEC_T]),
    assign: 'rand',

function lMax(n) {
  return Math.max(1, Math.floor(n / 3));
}
function lW(n) {

}
function lThirdMax(n) {

}

}

}
function lStepOk(d) {

    w = Math.max(1, Math.min(lW(n) + d, lMax(n))),
    m = [...L().must],
    cw = m.filter((x) => SPEC_W.includes(x)).length;
  return w !== lW(n) && cw <= w && m.length - cw <= n - w;
}
function lStepW(d) {

}
function lNorm() {

    l = L(),
    w = lW(n);
  let cw = 0,
    cc = 0;
  [...l.must].forEach((r) => {
    const isW = SPEC_W.includes(r);
    if (isW ? ++cw > w : ++cc > n - w) {
      l.must.delete(r);
      l.on.add(r);
      lClr(r);
    }

// --- Game Master umano ---
function setMode(m) {
  S.mode = m;
  render();
  if (m === 'auto' && ['impostore', 'mrwhite', 'who_said'].includes(S.game)) maybeDbTip();
}
function gmN() {
  let n = (S.gmName || '').trim() || 'GM';
  if (S.players.includes(n)) n += ' (GM)';
  return n;
}
function PW() {
  return S.mode === 'gm' && S.gmPlay && S.game === 'who_said' ? [...S.players, gmN()] : S.players;
}
function canStart() {
  const g = S.game;
  if (!PLAYABLE.includes(g)) return false;
  if (g === 'preferisci') {
    const a = S.pv.a.trim(),
      b = S.pv.b.trim();
    return S.players.length >= 2 && !!a && !!b && a.toLowerCase() !== b.toLowerCase();
  }
  if ((g === 'who_said' ? PW() : S.players).length < (g === 'lupus' ? 4 : 3)) return false;
  const e = eff();
  if (g === 'mrwhite' && e.und + e.mw === 0) return false;
  if (g === 'lupus') return true;
  if (S.mode === 'gm') {
    const m = S.gm,
      a = m.a.trim(),
      b = m.b.trim(),
      c = m.c.trim();
    if (g === 'mrwhite') return !!a && (!e.und || !!b) && (!e.mw || !!c);
    if (g === 'impostore') return !!a && (!impN() || !!b);
    return !!a;
  }
  return true;
}
function chk() {
  const b = $('start-btn');
  if (b) b.disabled = !canStart();
}
function gmRand() {
  if (S.game === 'mrwhite') {
    const cs = [...S.cfg.cats],
      cat = cs[rnd(cs.length)],
      p = pickPair(cat),
      off = S.lang === 'it' ? 0 : 2,
      sw = rnd(2);
    S.gm.a = p[off + sw];
    S.gm.b = p[off + 1 - sw];
    S.gm.c = t('cat_' + cat);
  } else if (S.game === 'impostore') {
    const tr = pickU(rnd(2) ? impGen() : impHand(), (x) => x.q);
    S.gm.a = tr.q;
    S.gm.b = tr.alt[rnd(tr.alt.length)][1];
  } else S.gm.a = pickWhoQ();
  render();
}
function modeUI(g) {
  const b = (m) =>
    `<button onclick="setMode('${m}')" class="flex-1 py-2 rounded-lg text-xs font-bold ${S.mode === m ? 'bg-purple-600' : 'bg-slate-800 text-slate-400'}">${t(m === 'auto' ? 'modeAuto' : 'modeGm')}</button>`;
  const IC =
    'min-w-0 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500';
  const inp = (k, l, first) =>
    `<div><p class="text-[11px] text-slate-400 mb-1">${l}</p><div class="flex gap-2"><input autocomplete="off" value="${esc(S.gm[k])}" oninput="S.gm.${k}=this.value;chk()" class="flex-1 ${IC}">${first ? `<button onclick="gmRand()" class="px-3 rounded-xl bg-slate-800 text-lg" title="${t('gmRand')}">🎲</button>` : ''}</div></div>`;
  let x = '';
  if (S.mode === 'gm') {
    const e = eff();
    if (g === 'mrwhite')
      x =
        inp('a', t('gmCiv'), 1) +
        (e.und ? inp('b', t('gmUnd')) : '') +
        (e.mw ? inp('c', t('gmHint')) : '');
    else if (g === 'impostore')
      x = inp('a', t('gmQCiv'), 1) + (impN() ? inp('b', t('gmQImp')) : '');
    else
      x =
        inp('a', t('gmQ'), 1) +
        `<div class="flex items-center justify-between text-xs font-bold pt-1"><span>${t('gmPlays')}</span><button onclick="S.gmPlay=!S.gmPlay;render()" class="px-3 py-1.5 rounded-lg ${S.gmPlay ? 'bg-purple-600' : 'bg-slate-800 text-slate-400'}">${S.gmPlay ? 'ON' : 'OFF'}</button></div>` +
        (S.gmPlay
          ? `<input autocomplete="off" value="${esc(S.gmName)}" oninput="S.gmName=this.value;chk()" placeholder="${t('gmName')}" class="w-full ${IC}">`
          : '');
    x =
      `<p class="text-[11px] text-slate-400">${t(g === 'who_said' ? 'gmInfoW' : g === 'lupus' ? 'gmInfoL' : 'gmInfo')}</p>` +
      (g === 'lupus' ? '' : x);
  }
  return `<div class="pt-3 border-t border-slate-700/60 space-y-2"><p class="text-xs font-bold">${t('modeTitle')}</p><div class="flex gap-2">${b('auto')}${b('gm')}</div>${x}</div>`;
}
function applyGM() {
  const G = S.G,
    m = S.gm,
    a = m.a.trim(),
    b = m.b.trim(),
    g = S.game;
  if (g === 'mrwhite') {
    const u = G.limits.und ? b : a;
    G.pair = [a, u, a, u];
    G.swap = false;
    G.hint = G.limits.mw ? m.c.trim() : '';
  } else if (g === 'impostore') {
    G.qCiv = a;
    G.qImp = G.limits.imp ? b : a;

    G.q = a;
    G.phase = S.quick ? 'wqdone' : 'wans';
  }
}
function newRound() {
  if (S.mode === 'gm') {
    S.gm = { a: '', b: '', c: '' };
    S.G = null;
    S.sel = null;
    S.screen = 'setup';
    render();
  } else startGame();
}
const _sg = startGame;
startGame = function () {
  _sg();
  if (S.G && S.screen === 'play' && S.mode === 'gm') {
    applyGM();
    render();
  }
};

// --- Chi l'ha detto? ---
function pickU(pool, key) {
  let fr = pool.filter((x) => !S.used.has(key(x)));
  if (!fr.length) {
    pool.forEach((x) => S.used.delete(key(x)));
    fr = pool;
  }
  const x = fr[rnd(fr.length)];
  S.used.add(key(x));
  return x;
}
function pickWhoQ() {
  return pickU(whoPool(), (x) => x);
}
function startWho() {
  S.G = {
    phase: 'wq',
    q: pickWhoQ(),
    order: shuffle(PW()),
    idx: 0,
    shown: false,
    ans: {},
    pick: null,
    votes: {},
    vi: 0,
    awards: null
  };
  S.screen = 'play';
  render();
}
function rerollWho() {
  S.G.q = pickWhoQ();
  render();
}
function wGo() {
  S.G.phase = S.quick ? 'wqdone' : 'wans';
  render();
}
function wSend() {
  const G = S.G,
    p = G.order[G.idx];
  const v = $('w-in').value.trim().slice(0, 60);
  if (!v) {
    $('w-in').focus();
    return;
  }
  G.ans[p] = v;
  G.shown = false;
  G.idx++;
  if (G.idx >= G.order.length) {
    G.pick = PW()[rnd(PW().length)];
    G.order = shuffle(PW());
    G.vi = 0;
    G.phase = 'wvote';
  }
  render();
}
function wVote(i) {
  const G = S.G;
  G.votes[G.order[G.vi]] = PW()[i];
  G.vi++;
  if (G.vi >= G.order.length) {
    G.awards = {};
    scoreSnap();
    PW().forEach((p) => {
      G.awards[p] = p !== G.pick && G.votes[p] === G.pick ? 100 : 0;
      S.scores[p] = (S.scores[p] || 0) + G.awards[p];
    });
    G.phase = 'wres';
  }
  render();
}
function viewWho() {
  const G = S.G,
    n = PW().length;

    return `<div class="space-y-4 py-2 text-center"><p class="text-xs text-slate-400">${t('question')}</p><h2 class="text-xl font-extrabold text-white">${esc(G.q)}</h2><button onclick="rerollWho()" class="w-full bg-slate-800 py-3 rounded-xl font-bold text-sm">${t('reroll')}</button><button onclick="wGo()" class="${BTN}">${S.quick ? X('Si gioca a voce', 'Play out loud') : t('start')}</button></div>`;

  if (G.phase === 'wans') {

    return !G.shown

      : `<div class="space-y-4 py-2"><p class="text-center text-slate-400 text-sm">${esc(p)}</p><h2 class="text-lg font-extrabold text-white text-center">${esc(G.q)}</h2><input autocomplete="off" id="w-in" oninput="$('w-btn').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')wSend()" placeholder="${t('ansPh')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-purple-500"><button id="w-btn" disabled onclick="wSend()" class="${BTN}">${t('send')}</button></div>`;

    )
    .join('')}</div>
  <button onclick="newRound()" class="${BTN}">${t('newRound')}</button></div>`;
}

// --- Impostore ---
function impN() {
  return Math.max(0, Math.min(S.cfg.imp, S.players.length - 1));
}
function stepImp(d) {
  S.cfg.imp = Math.max(0, Math.min(impN() + d, Math.max(0, S.players.length - 1)));
  render();
}
function startImp() {
  const n = S.players.length,
    k = impN(),
    tr = pickU(rnd(2) ? impGen() : impHand(), (x) => x.q),
    alt = tr.alt[rnd(tr.alt.length)][1];
  const list = shuffle([...Array(n - k).fill('civ'), ...Array(k).fill('imp')]),
    roles = {};
  shuffle(S.players).forEach((p, i) => (roles[p] = list[i]));
  const assign = {};
  S.players.forEach((p) => (assign[p] = 'pool'));
  S.G = {
    phase: 'ireveal',
    order: shuffle(S.players),
    idx: 0,
    shown: false,
    roles,
    qCiv: tr.q,
    qImp: alt,
    answers: {},
    assign,
    limits: { civ: n - k, imp: k },
    slots: [
      ['civ', 'border-emerald-500/50'],
      ['imp', 'border-rose-500/50']
    ],
    awards: null,
    done: false
  };
  S.sel = null;
  S.screen = 'play';
  render();
}
function sendAns() {
  const G = S.G,
    p = G.order[G.idx];
  const v = $('ans-in').value.trim().slice(0, 60);
  if (!v) {
    $('ans-in').focus();
    return;

  G.answers[p] = v;
  G.shown = false;
  G.idx++;
  if (G.idx >= G.order.length) G.phase = 'idiscuss';
  render();
}
function viewImp() {
  if (S.G.phase === 'qdone') return viewQ();
  const G = S.G,
    n = S.players.length;
  if (G.phase === 'ireveal') {
    const p = G.order[G.idx],
      q = G.roles[p] === 'imp' ? G.qImp : G.qCiv;
    return !G.shown
      ? `<div class="text-center space-y-5 py-6"><p class="text-slate-400 text-sm">${t('passTo')}</p><h2 class="text-3xl font-extrabold gtext">${esc(p)}</h2><button onclick="reveal()" class="${BTN}">${t('tapReveal')}</button><p class="text-xs text-slate-500">${G.idx + 1}/${n}</p></div>`
      : `<div class="space-y-4 py-2"><p class="text-center text-slate-400 text-sm">${esc(p)}</p><p class="text-xs text-slate-400 text-center">${t('yourQ')}</p><h2 class="text-xl font-extrabold text-white text-center">${esc(q)}</h2>${S.quick ? `<button onclick="hideNext()" class="${BTN}">${t('hide')}</button>` : `<input autocomplete="off" id="ans-in" oninput="$('ans-btn').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')sendAns()" placeholder="${t('ansPh')}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-purple-500"><button id="ans-btn" disabled onclick="sendAns()" class="${BTN}">${t('send')}</button>`}</div>`;

  return `<div class="space-y-3"><h3 class="font-bold text-white">${t('result')}</h3>

  <div class="flex flex-wrap gap-1.5 justify-center">${S.players
    .filter((p) => G.awards[p] > 0)
    .map(
      (p) =>
        `<span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">${esc(p)} +${G.awards[p]}</span>`

    .join('')}</div>

function viewSetup() {

function startPref() {

    alert(t('pvNeed'));

  }
  S.mode = 'auto';
  S.G = {
    phase: 'pvpass',
    order: shuffle(S.players),
    idx: 0,
    shown: false,
    votes: {},
    a,
    b,

function pvShow() {

function pvVote(k) {
  const G = S.G;
  G.votes[G.order[G.idx]] = k;
  G.shown = false;
  G.idx++;
  if (G.idx >= G.order.length) pvCalc();
  else render();
}
function pvCalc() {
  const G = S.G,
    P = S.players,
    ca = P.filter((p) => G.votes[p] === 'a').length,
    cb = P.length - ca,
    tie = ca === cb,
    maj = ca > cb ? 'a' : 'b',
    pts = tie ? 50 : 100,
    aw = {};
  P.forEach((p) => (aw[p] = tie || G.votes[p] === maj ? pts : 0));
  scoreSnap();
  P.forEach((p) => (S.scores[p] = (S.scores[p] || 0) + aw[p]));
  G.ca = ca;
  G.cb = cb;
  G.tie = tie;
  G.pts = pts;
  G.awards = aw;
  G.phase = 'pvres';
  render();
}

function pvChk() {

    P = NET.players;
  if (!G || G.g !== 'pv') return;
  if (P.length < 2) return toLobby();
  if (G.ph === 'vote' && P.every((p) => G.votes[p] !== undefined)) {
    const ca = P.filter((p) => G.votes[p] === 'a').length,
      cb = P.length - ca,
      tie = ca === cb,
      maj = ca > cb ? 'a' : 'b',
      pts = tie ? 50 : 100,
      aw = {};

  }

}

      b: G.b,
      ca: G.ca,

      players: P,

function ncCounts(G) {
  const P = NET.players,
    L = String(G.letter || '').toLowerCase(),
    counts = {};
  G.cats.forEach((c) => {
    const m = {};
    P.forEach((p) => {
      const v = ncNorm((G.a[p] || {})[c.k]);
      if (!v || v[0] !== L) return;
      (m[v] = m[v] || []).push(p);
    });
    counts[c.k] = m;
  });
  return counts;
}

  const P = NET.players,
    L = String(G.letter || '').toLowerCase(),
    counts = ncCounts(G),
    out = [];
  G.cats.forEach((c) => {
    P.forEach((p) => {
      const v = ncNorm((G.a[p] || {})[c.k]);
      if (v && v[0] === L && (counts[c.k][v] || []).length === 1) out.push([p, c.k]);

function ncCalc(G) {
  const P = NET.players,

  P.forEach((p) => {
    aw[p] = {};
    pts[p] = 0;

  G.cats.forEach((c) => {
    P.forEach((p) => {
      const v = ncNorm((G.a[p] || {})[c.k]);
      let sc = 0;
      if (v && v[0] === L) {
        // Duplicati: +5 automatico. Unica valida: 0 se l'host la rifiuta, +10 altrimenti.
        sc = (counts[c.k][v] || []).length > 1 ? 5 : G.ok && G.ok[p] && G.ok[p][c.k] === false ? 0 : 10;

// Le statistiche arrivano anche da un backup: vanno validate come tutto il resto.
function sanitizeStats(x) {
  const out = { games: 0, byGame: {}, wins: {}, played: {}, streak: {}, best: {}, recent: [] };
  if (!x || typeof x !== 'object') return out;
  out.games = Math.max(0, Math.min(99999, Math.round(+x.games || 0)));
  out.recent = (Array.isArray(x.recent) ? x.recent : [])
    .slice(0, 20)
    .map((e) => ({
      g: e && typeof e.g === 'string' && GAME_START[e.g] ? e.g : '',
      t: Math.max(0, Math.min(Date.now() + 86400000, +((e && e.t) || 0))),
      w: cleanText(e && e.w, 60)
    }))
    .filter((e) => e.g && e.t)
    .sort((a, b) => b.t - a.t)
    .slice(0, 20);
  [
    ['byGame', 400],
    ['wins', 9999],
    ['played', 9999],
    ['streak', 9999],
    ['best', 9999]
  ].forEach(([k, cap]) => {
    const src = x[k];
    if (!src || typeof src !== 'object') return;
    Object.keys(src)
      .slice(0, 80)
      .forEach((key) => {
        const name = k === 'byGame' ? String(key).slice(0, 20) : cleanName(key, 20);
        const v = Math.round(+src[key]);
        if (!name || !isFinite(v) || v < 0) return;
        if (k === 'byGame' && !GAME_START[name]) return;
        out[k][name] = Math.min(cap, v);
      });
  });
  return out;
}

// Apre la modale e porta il focus dentro; closeModal ripristina il focus dopo.
function modalFocusables() {
  try {
    const m = $('modal');
    if (!m || !m.querySelectorAll) return [];
    return Array.from(
      m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    ).filter((el) => el && !el.disabled);
  } catch (e) {
    return [];
  }
}
// Tab resta dentro la modale, Escape la chiude.
function trapFocus(e) {
  const m = $('modal');
  if (!m || m.style.display !== 'flex' || !e) return;
  if (e.key === 'Escape') {
    if (e.preventDefault) e.preventDefault();
    closeModal();
    return;
  }
  if (e.key !== 'Tab') return;
  const f = modalFocusables();
  if (!f.length) return;
  const first = f[0],
    last = f[f.length - 1],
    active = document.activeElement;
  if (e.shiftKey && active === first) {
    if (e.preventDefault) e.preventDefault();
    if (last.focus) last.focus();
  } else if (!e.shiftKey && active === last) {
    if (e.preventDefault) e.preventDefault();
    if (first.focus) first.focus();
  }
}
function modalOpen() {
  const m = $('modal');
  if (!m) return;
  MODAL_PREV = (typeof document !== 'undefined' && document.activeElement) || null;
  m.style.display = 'flex';
  m.setAttribute('aria-hidden', 'false');
  setTimeout(() => {
    try {
      const list = m.querySelectorAll
        ? m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
        : [];
      if (list && list.length && list[0].focus) list[0].focus();
    } catch (e) {}
  }, 30);
}

        if (NC_CATS.some((c) => ncLab(c).toLowerCase() === name.toLowerCase())) return;
        const k =
          x && typeof x.k === 'string' && /^cu[a-z0-9]{1,20}$/.test(x.k) && !NC_CATS.some((c) => c.k === x.k)
            ? x.k
            : 'cu' + Date.now().toString(36) + NC_CATS.length;
        NC_CATS.push({ k: k, it: name, en: name });
      });
  } catch (e) {}
}
let LAST_SCREEN = '';
// Ingresso morbido quando si cambia schermata (una sola animazione, non a ogni render).
function screenIn() {
  try {
    const el = $('app');
    if (!el || !el.classList || S.screen === LAST_SCREEN) return;
    LAST_SCREEN = S.screen;
    el.classList.remove('screen-in');
    void el.offsetWidth;
    el.classList.add('screen-in');
  } catch (e) {}
}
function render() {
  if (S.screen === 'online' && NET.game && NET.game.g === 'lupus' && S.G) lupSync();
  statsTick();
  const on = 'px-2 py-1 text-[11px] font-bold rounded-lg bg-purple-600 text-white',
    off = 'px-2 py-1 text-[11px] font-bold rounded-lg text-slate-400';
  $('lb-it').className = S.lang === 'it' ? on : off;
  $('lb-en').className = S.lang === 'en' ? on : off;
  $('lb-it').setAttribute('aria-pressed', S.lang === 'it');
  $('lb-en').setAttribute('aria-pressed', S.lang === 'en');
  $('set').setAttribute('aria-label', t('settings'));
  $('set').setAttribute('title', t('settings'));
  $('modal').setAttribute('aria-label', t('dialog'));
  $('hlp').setAttribute('aria-label', X('Aiuto e regole', 'Help and rules'));
  $('hlp').setAttribute('title', X('Aiuto e regole', 'Help and rules'));
  $('scr').setAttribute('aria-label', X('Punteggi', 'Scores'));
  $('scr').setAttribute('title', X('Punteggi', 'Scores'));
  const top = Object.entries(S.scores).sort((a, b) => b[1] - a[1])[0];
  $('top').textContent = top && top[1] > 0 ? `${top[0]}: ${top[1]}` : t('points');
  document.documentElement.lang = S.lang;
  const body =
    S.screen === 'home'
      ? viewHome()
      : S.screen === 'setup'
        ? viewSetup()
        : S.screen === 'lroles'
          ? viewLRoles()
          : S.screen === 'ltype'
            ? NET.lsetup
              ? (setTimeout(() => startLupus(1), 0), '')
              : viewLType()
            : S.screen === 'online'
              ? viewOnline()
              : S.screen === 'pvsetup'
                ? viewPvSetup()
                : S.screen === 'ncsetup'
                  ? viewNcSetup()
                  : S.screen === 'tbsetup'
                    ? viewTbSetup()
                    : viewPlay();
  applyGameAccent();
  const sum = summaryBar();
  $('app').innerHTML = (S.demo ? demoBar() : '') + sum + body;
  screenIn();
  if (sum) maybeConfetti();
  else CONF_SIG = '';
  if (!tmAllowed() && (TMR.iv || TMR.done)) tmClear();
  if (tmAuto() && (TMR.iv || TMR.done)) tmClear();
  tmDraw();
  saveLocal();
  saveSession();
  netMirror();
}
loadLocal();
loadSession();
parseInvite();
applyTheme();
applyA11y();
updateOffline();
// PWA: installabile e avviabile offline quando è servita via http(s).
function showUpd() {
  const el = $('upd');
  if (!el) return;
  const s = el.querySelector ? el.querySelector('span') : null,
    go = $('upd-go'),
    x = $('upd-x');
  if (s) s.textContent = t('updateReady');
  if (go) go.textContent = t('updateBtn');
  if (x) x.setAttribute('aria-label', X('Chiudi', 'Close'));
  el.classList.add('on');
}
function hideUpd() {
  const el = $('upd');
  if (el) el.classList.remove('on');
}
// --- Wake Lock: tiene acceso lo schermo mentre gira un timer ---
let WAKE = null,
  WAKE_ASK = null;
function wakeWanted() {
  try {
    return !!(tmAllowed() && (TMR.iv || TMR.done || tmAuto()));
  } catch (e) {
    return false;
  }
}
function wakeSync() {
  try {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    if (wakeWanted()) {
      if (WAKE || WAKE_ASK) return;
      WAKE_ASK = navigator.wakeLock
        .request('screen')
        .then((s) => {
          WAKE = s;
          try {
            s.addEventListener('release', () => {
              WAKE = null;
            });
          } catch (e) {}
        })
        .catch(() => {})
        .then(() => {
          WAKE_ASK = null;
        });
    } else if (WAKE) {
      const s = WAKE;
      WAKE = null;
      try {
        s.release();
      } catch (e) {}
    }
  } catch (e) {}
}
function showPrivacy() {
  const m = $('modal');
  if (!m) return;
  m.innerHTML = `<div class="glass w-full max-w-sm p-5 rounded-2xl space-y-3 max-h-[85vh] overflow-y-auto"><h3 class="font-bold text-white">🔒 ${t('privacyTitle')}</h3><div class="text-xs text-slate-300 space-y-2 leading-relaxed"><p>${t('privacyLocal')}</p><p>${t('privacyOnline')}</p><p>${t('privacyNoTrack')}</p><p>${t('privacyBackup')}</p></div><button onclick="closeModal()" class="gbtn w-full py-2.5 rounded-xl text-xs font-bold">${t('close')}</button></div>`;
  modalOpen();
}
function pwaInit() {
  try {
    if (!/^https?:$/.test(String(location.protocol || ''))) return;
    if (!navigator.serviceWorker) return;
    // Se c'era già un service worker attivo, un cambio di controller = nuova versione.
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (had) showUpd();
    });
    navigator.serviceWorker
      .register('sw.js')
      .then((reg) => {
        const upd = () => {
          try {
            reg.update();
          } catch (e) {}
        };
        setInterval(upd, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) upd();
        });
      })
      .catch(() => {});
  } catch (e) {}
}
pwaInit();
// Installazione: il browser decide quando l'app è installabile.
try {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    INSTALL_EVT = e;
  });
  window.addEventListener('appinstalled', () => {
    INSTALL_EVT = null;
  });
  window.addEventListener('online', updateOffline);
  window.addEventListener('offline', updateOffline);
} catch (e) {}
// Esc chiude la modale; Tab resta dentro la modale aperta.
document.addEventListener('keydown', (e) => {
  const m = $('modal');
  if (!m || m.style.display === 'none') return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal();
    return;
  }
  if (e.key !== 'Tab') return;
  let list = [];
  try {
    list = m.querySelectorAll
      ? [].slice.call(m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      : [];
  } catch (err) {}
  list = list.filter((x) => !x.disabled);
  if (!list.length) return;
  const first = list[0],
    last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});
if (window.addEventListener)
  window.addEventListener('pagehide', () => saveSession(true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveSession(true);
});
// Rientro in primo piano o rete tornata: ricalcolo i timer e richiedo lo stato.
function netWake() {
  wakeSync();
  if (TMR.iv) tmTick();
  if (NET.host && NET.game && NET.game.g === 'nc' && NET.game.ph === 'play') ncTick();
  if (NET.host && NET.game && NET.game.g === 'tb' && NET.game.ph === 'play') tbTick();
  if (!NET.host && NET.conn) netSync();
  if (NET.peer && NET.peer.disconnected && !NET.peer.destroyed) {
    try {
      NET.peer.reconnect();
    } catch (e) {}
  }
  render();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) netWake();
});
if (document.addEventListener) document.addEventListener('keydown', trapFocus);
if (window.addEventListener) window.addEventListener('online', netWake);
// Sblocco audio su iOS al primo gesto (timer di discussione).
if (document.addEventListener)
  ['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    document.addEventListener(ev, audioUnlock, { passive: true })
  );
// Il timer automatico del round si aggiorna da solo anche senza messaggi.
setInterval(() => {
  if (tmAuto() && tmAllowed()) tmDraw();
  if (NET.view && NET.view.t === 'tb') tbPaintTime();
}, 500);
render();
</script>
